    const z1 = { peso_muestra: leer('cpp-peso_z1'), cascara_g: leer('cpp-cascara_z1'), capote_g: leer('cpp-capote_z1'), pulpa_g: leer('cpp-pulpa_z1'), subpulpa: { mariposas: leer('cpp-mar_z1'), cuartos: leer('cpp-cua_z1'), cuartillos: leer('cpp-cuar_z1') } };
    const z2 = { peso_muestra: leer('cpp-peso_z2'), cascara_g: leer('cpp-cascara_z2'), capote_g: leer('cpp-capote_z2'), pulpa_g: leer('cpp-pulpa_z2'), subpulpa: { mariposas: leer('cpp-mar_z2'), cuartos: leer('cpp-cua_z2'), cuartillos: leer('cpp-cuar_z2') } };
    if(z1.peso_muestra <= 0 && z2.peso_muestra <= 0){ msg('Ingresá al menos los datos de una zaranda.','err'); return; }
    datos = { punto, fecha, hora, turno, lote_id: loteId, peso_muestra: null, cascara_g: 0, capote_g: 0, pulpa_g: null, colores: null, subpulpa: { z1, z2 }, observaciones: document.getElementById('cpp-obs')?.value||'' };
  } else {
    datos = {
      punto, fecha, hora, turno,
      peso_muestra: cfg.campos.includes('peso_muestra') ? (parseFloat(document.getElementById('cpp-peso')?.value)||0) : null,
      cascara_g: parseFloat(document.getElementById('cpp-cascara')?.value)||0,
      capote_g: parseFloat(document.getElementById('cpp-capote')?.value)||0,
      pulpa_g: cfg.campos.includes('pulpa') ? (parseFloat(document.getElementById('cpp-pulpa')?.value)||0) : null,
      observaciones: document.getElementById('cpp-obs')?.value||''
    };
    if(cfg.campos.includes('colores')){
      datos.colores = {};
      COLORES_PROCESO.forEach(c=>{ const key=c.replace(/[^a-z]/gi,'').toLowerCase(); datos.colores[c]=parseFloat(document.getElementById(`cpp-color-${key}`)?.value)||0; });
    }
  }

  try {
    await api('POST','/control-proceso', datos);
    msg('Registro guardado correctamente','ok');
    renderControlProceso();
  } catch(e){ msg(e.message,'err'); }
}

function renderMantCard(m, resuelto){

  return `<div style="border:2px solid ${resuelto?'#a3cfbb':n.border};border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;background:${resuelto?'#f0fdf4':n.bg}">

        <span style="background:${resuelto?'#1D9E75':n.color};color:#fff;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700">${resuelto?'✅ RESUELTO':n.label}</span>
        <span style="font-weight:600">${m.maquina}</span>
      </div>
      <div style="font-size:11px;color:var(--color-text-secondary);text-align:right">
        ${m.fecha} ${m.hora}<br>Reportó: <strong>${m.usuario}</strong>
      </div>
    </div>
    <div style="font-size:13px;margin-bottom:${resuelto||!canResolver?'0':'10px'}">${m.descripcion}</div>
    ${resuelto?`<div style="margin-top:8px;padding:8px;background:#fff;border-radius:var(--radius);font-size:12px;border:1px solid #a3cfbb"><strong>Solución:</strong> ${m.solucion||'—'}<br><span style="color:var(--color-text-secondary)">Resolvió: ${m.usuarioResolucion||'—'} · ${m.fechaResolucion||''} ${m.horaResolucion||''}</span></div>`:''}

      ${resuelto && (currentUser.rol==='ceo' || getRolePerm(currentUser.rol).canBorrarMant) ? `<div style="margin-top:8px"><button class="stbtn" style="color:var(--color-danger)" onclick="borrarMantenimiento(${m.id})"><i class="ti ti-trash"></i> Borrar</button></div>` : ''}
    ${!resuelto && canResolver ? `<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
      <div class="field" style="flex:1;margin:0"><label style="font-size:12px">¿Qué se hizo para resolverlo?</label>
        <textarea id="mt-sol-${m.id}" rows="2" placeholder="Describí la solución aplicada..."></textarea>
      </div>
      <button class="btn1" style="background:#1D9E75;border-color:#1D9E75;height:38px" onclick="resolverMantenimiento(${m.id})">
        <i class="ti ti-check"></i> Marcar resuelto
      </button>
    </div>`:''}
  </div>`;
}

async function borrarMantenimiento(id){
  if(!confirm('¿Borrar este registro de mantenimiento?'))return;
  try{
    await api('DELETE',`/mantenimiento/${id}`);
    mantenimientoCache=await api('GET','/mantenimiento');
    msg('Registro eliminado','ok');
    renderMantenimiento();
    actualizarBadgeMant();
  }catch(e){msg('Error al borrar','err');}
}

async function guardarMantenimiento(){
  const maquina=document.getElementById('mt-maq')?.value;
  const nivel=document.getElementById('mt-nivel')?.value;
  const descripcion=document.getElementById('mt-desc')?.value.trim();
  if(!descripcion){msg('Describí el problema antes de registrar.','err');return;}
  try{
    await api('POST','/mantenimiento',{maquina,nivel,descripcion});
    mantenimientoCache=await api('GET','/mantenimiento');
    document.getElementById('mt-desc').value='';
    msg('Evento registrado correctamente.','ok');
    renderMantenimiento();
    actualizarBadgeMant();
  }catch(e){msg('Error al registrar','err');}
}

async function resolverMantenimiento(id){
  const solucion=document.getElementById(`mt-sol-${id}`)?.value.trim();
  if(!solucion){msg('Describí la solución antes de marcar como resuelto.','err');return;}
  try{
    await api('PUT',`/mantenimiento/${id}`,{solucion});
    mantenimientoCache=await api('GET','/mantenimiento');
    msg('Evento marcado como resuelto.','ok');
    renderMantenimiento();
    actualizarBadgeMant();
  }catch(e){msg('Error al resolver','err');}
}

function actualizarBadgeMant(){
  const criticos=mantenimientoCache.filter(m=>!m.resuelto&&m.nivel==='critico').length;
  const btn=document.querySelector('[data-sec="mantenimiento"]');
  if(!btn)return;
  const badge=btn.querySelector('.mant-badge');
  if(criticos>0){
    if(badge) badge.textContent=criticos;
    else btn.insertAdjacentHTML('beforeend',`<span class="mant-badge" style="background:#DC2626;color:#fff;border-radius:999px;padding:0 5px;font-size:10px;font-weight:700;margin-left:4px">${criticos}</span>`);
  } else {
    if(badge) badge.remove();
  }
}

function calcPesoMuestra(){
  const bb=parseInt(document.getElementById('cf-bb')?.value)||0;
  const pu=parseFloat(document.getElementById('cf-pesounit')?.value)||250;
  const tot=document.getElementById('cf-total-muestra');
  if(bb>0){tot.style.display='block';tot.textContent=`Peso total de muestra: ${bb} BB × ${pu} gr = ${(bb*pu).toFixed(0)} gr`;}
  else{tot.style.display='none';}
}

function calcFruta(){
  const el=parseFloat(document.getElementById('cf-el')?.value)||0;
  const li=parseFloat(document.getElementById('cf-light')?.value)||0;

function prevFoto(inputId, prevId){
  const file=document.getElementById(inputId)?.files[0];
  const prev=document.getElementById(prevId);if(!file||!prev)return;
  const reader=new FileReader();
  reader.onload=e=>{prev.innerHTML=`<img src="${e.target.result}" style="max-width:100%;max-height:200px;border-radius:var(--radius);border:1px solid var(--color-border);margin-top:4px"/>`};
  reader.readAsDataURL(file);
}

async function toBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});
}

async function guardarCalidadFruta(){
  const loteId=document.getElementById('cf-lote')?.value;
  const hora=document.getElementById('cf-hora')?.value||'';
  const fecha=document.getElementById('cf-fecha')?.value;
  const bb=parseInt(document.getElementById('cf-bb')?.value)||0;
  const pu=parseFloat(document.getElementById('cf-pesounit')?.value)||250;
  const el=parseFloat(document.getElementById('cf-el')?.value)||0;
  const li=parseFloat(document.getElementById('cf-light')?.value)||0;
  const la=parseFloat(document.getElementById('cf-la')?.value)||0;
  const am=parseFloat(document.getElementById('cf-ambar')?.value)||0;
  const su=parseFloat(document.getElementById('cf-surt')?.value)||0;
  const fotoFile=document.getElementById('cf-foto')?.files[0];
  if(!loteId){msg('Seleccioná un lote.','err');return;}
  if(!fecha){msg('Seleccioná la fecha.','err');return;}
  if(bb<=0){msg('Ingresá la cantidad de BB muestreados.','err');return;}
  if((el+li+la+am+su)<=0){msg('Ingresá al menos un peso en la separación.','err');return;}
  if(!fotoFile){msg('La foto de la muestra es obligatoria.','err');return;}
  try{
    const foto=fotoFile?await toBase64(fotoFile):null;
    const res=await api('POST','/calidad/fruta',{
      loteId,hora,fecha,bbMuestreados:bb,pesoMuestraTotal:bb*pu,
      extraLight:el,light:li,lightAmbar:la,ambar:am,surtidoIndustrial:su,
      picadoInsecto:parseFloat(document.getElementById('cf-pi')?.value)||0,
      hongo:parseFloat(document.getElementById('cf-hongo')?.value)||0,
      vano:parseFloat(document.getElementById('cf-vano')?.value)||0,
      rancio:parseFloat(document.getElementById('cf-rancio')?.value)||0,
      foto,observaciones:document.getElementById('cf-obs')?.value.trim()||''
    });
    msg(`Control guardado — Rendimiento estimado: ${res.rendimientoEstimado}%`,'ok');
    calidadFrutaCache=await api('GET','/calidad/fruta');
    filtrarCalFruta();
    // Limpiar form
    ['cf-lote','cf-bb','cf-el','cf-light','cf-la','cf-ambar','cf-surt','cf-pi','cf-hongo','cf-vano','cf-rancio','cf-obs'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    document.getElementById('cf-foto').value='';
    document.getElementById('cf-foto-prev').innerHTML='';
    document.getElementById('cf-resultado').style.display='none';
    document.getElementById('cf-total-muestra').style.display='none';
  }catch(e){msg(e.message,'err');}
}

function calcPulpa(){
  const totalForma=(parseFloat(document.getElementById('cp-mar')?.value)||0)+(parseFloat(document.getElementById('cp-cua')?.value)||0)+(parseFloat(document.getElementById('cp-oct')?.value)||0)+(parseFloat(document.getElementById('cp-troz')?.value)||0)+(parseFloat(document.getElementById('cp-polv')?.value)||0);
  const totalColor=(parseFloat(document.getElementById('cp-el')?.value)||0)+(parseFloat(document.getElementById('cp-li')?.value)||0)+(parseFloat(document.getElementById('cp-am')?.value)||0)+(parseFloat(document.getElementById('cp-aml')?.value)||0)+(parseFloat(document.getElementById('cp-amb')?.value)||0);
  const tf=totalForma||1,tc=totalColor||1;
  const pctCua=(parseFloat(document.getElementById('cp-cua')?.value)||0)/tf*100;
  const pctOct=(parseFloat(document.getElementById('cp-oct')?.value)||0)/tf*100;
  const pctPolv=(parseFloat(document.getElementById('cp-polv')?.value)||0)/tf*100;
  const pctEL=(parseFloat(document.getElementById('cp-el')?.value)||0)/tc*100;
  const pctRL=((parseFloat(document.getElementById('cp-rl')?.value)||0)+(parseFloat(document.getElementById('cp-ml')?.value)||0))/tf*100;
  const pctRG=(parseFloat(document.getElementById('cp-rg')?.value)||0)/tf*100;
  const pctMG=(parseFloat(document.getElementById('cp-mg')?.value)||0)/tf*100;
  const pctHI=(parseFloat(document.getElementById('cp-hi')?.value)||0)/tf*100;
  const pctHA=(parseFloat(document.getElementById('cp-ha')?.value)||0)/tf*100;
  const hum=parseFloat(document.getElementById('cp-hum')?.value)||0;
  const varSelected=document.getElementById('cp-var')?.value;
  const colorObj=document.getElementById('cp-color')?.value;
  let estadoForma='OK',estadoColor='OK',estadoDefectos='OK';
  if(varSelected==='Mariposa'&&(pctCua>20||pctOct>3||pctPolv>0.2))estadoForma='FUERA ESPEC';
  if(colorObj==='EL'&&pctEL<85)estadoColor='FUERA ESPEC';
  if(colorObj==='EL-L'&&pctEL<50)estadoColor='FUERA ESPEC';
  if(pctRL>4||pctRG>2||pctMG>2||pctHI>2||pctHA>0.2)estadoDefectos='FUERA ESPEC';

  res.style.display='block';
  res.innerHTML=`<div style="border:2px solid ${colorRes};border-radius:var(--radius-lg);padding:1rem;background:${resultado==='CONFORME'?'var(--color-success-light)':'var(--color-danger-light)'}">
    <div style="font-size:18px;font-weight:700;color:${colorRes};text-align:center;margin-bottom:10px"><i class="ti ti-${resultado==='CONFORME'?'circle-check':'alert-circle'}"></i> ${resultado}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
      <div style="background:#fff;border-radius:var(--radius);padding:6px"><div style="font-size:11px;color:#666">Forma</div><div style="font-weight:700;color:${estadoForma==='OK'?'var(--color-success)':'var(--color-danger)'}">${estadoForma}</div></div>
      <div style="background:#fff;border-radius:var(--radius);padding:6px"><div style="font-size:11px;color:#666">Color</div><div style="font-weight:700;color:${estadoColor==='OK'?'var(--color-success)':'var(--color-danger)'}">${estadoColor}</div></div>
      <div style="background:#fff;border-radius:var(--radius);padding:6px"><div style="font-size:11px;color:#666">Defectos</div><div style="font-weight:700;color:${estadoDefectos==='OK'?'var(--color-success)':'var(--color-danger)'}">${estadoDefectos}</div></div>
    </div>
    ${totalForma>0?`<div style="margin-top:8px;font-size:12px;color:#666;text-align:center">Forma: Mariposa ${((parseFloat(document.getElementById('cp-mar')?.value)||0)/tf*100).toFixed(1)}% · Cuartos ${pctCua.toFixed(1)}% · Octavos ${pctOct.toFixed(1)}%</div>`:''}
    ${totalColor>0?`<div style="font-size:12px;color:#666;text-align:center">Color: EL ${pctEL.toFixed(1)}%</div>`:''}

  </div>`;
}

async function guardarCalidadPulpa(){
  const loteId=document.getElementById('cp-lote')?.value;   const hora=document.getElementById('cp-hora')?.value||'';
  const fecha=document.getElementById('cp-fecha')?.value;
  const fotoFile=document.getElementById('cp-foto')?.files[0];
  if(!loteId){msg('Seleccioná un lote.','err');return;}
  if(!fecha){msg('Seleccioná la fecha.','err');return;}
  const totalForma=(parseFloat(document.getElementById('cp-mar')?.value)||0)+(parseFloat(document.getElementById('cp-cua')?.value)||0)+(parseFloat(document.getElementById('cp-oct')?.value)||0);
  if(totalForma<=0){msg('Ingresá al menos los pesos de forma.','err');return;}
  if(!fotoFile){msg('La foto de la muestra es obligatoria.','err');return;}
  try{
    const foto=fotoFile?await toBase64(fotoFile):null;
    const res=await api('POST','/calidad/pulpa',{
      loteId,fecha,
      turno:document.getElementById('cp-turno')?.value,
      linea:document.getElementById('cp-linea')?.value,
      variedad:document.getElementById('cp-var')?.value,
      colorObjetivo:document.getElementById('cp-color')?.value,
      pesoMuestra:parseFloat(document.getElementById('cp-peso')?.value)||500,
      mariposaG:parseFloat(document.getElementById('cp-mar')?.value)||0,
      cuartosG:parseFloat(document.getElementById('cp-cua')?.value)||0,
      octavosG:parseFloat(document.getElementById('cp-oct')?.value)||0,
      trozosG:parseFloat(document.getElementById('cp-troz')?.value)||0,
      polvoG:parseFloat(document.getElementById('cp-polv')?.value)||0,
      elG:parseFloat(document.getElementById('cp-el')?.value)||0,
      lightG:parseFloat(document.getElementById('cp-li')?.value)||0,
      amarilloG:parseFloat(document.getElementById('cp-am')?.value)||0,
      ambarLightG:parseFloat(document.getElementById('cp-aml')?.value)||0,
      ambarG:parseFloat(document.getElementById('cp-amb')?.value)||0,
      resecaLeveG:parseFloat(document.getElementById('cp-rl')?.value)||0,
      manchaLeveG:parseFloat(document.getElementById('cp-ml')?.value)||0,
      resecaGraveG:parseFloat(document.getElementById('cp-rg')?.value)||0,
      manchaGraveG:parseFloat(document.getElementById('cp-mg')?.value)||0,
      hongoInactivoG:parseFloat(document.getElementById('cp-hi')?.value)||0,
      hongoActivoG:parseFloat(document.getElementById('cp-ha')?.value)||0,
      humedad:parseFloat(document.getElementById('cp-hum')?.value)||0,
      foto,observaciones:document.getElementById('cp-obs')?.value.trim()||''
    });
    const color=res.resultado==='CONFORME'?'ok':'err';
    msg(`Control guardado — ${res.resultado}`,'ok');
    calidadPulpaCache=await api('GET','/calidad/pulpa');
    filtrarCalPulpa();
    ['cp-mar','cp-cua','cp-oct','cp-troz','cp-polv','cp-el','cp-li','cp-am','cp-aml','cp-amb','cp-rl','cp-ml','cp-rg','cp-mg','cp-hi','cp-ha','cp-hum','cp-obs'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    document.getElementById('cp-foto').value='';
    document.getElementById('cp-foto-prev').innerHTML='';
    document.getElementById('cp-resultado').style.display='none';
  }catch(e){msg(e.message,'err');}
}

        <span style="font-size:12px;color:var(--color-text-secondary)">${fd(r.fecha)}</span>
        <span style="margin-left:auto;font-weight:700;color:${conforme?'var(--color-success)':'var(--color-danger)'};font-size:14px">
          <i class="ti ti-${conforme?'circle-check':'alert-circle'}"></i> ${r.resultado}

      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;text-align:center">

          <div style="font-size:10px;color:#666">FORMA</div>

          <div style="font-size:10px;color:#888">Mar:${(r.mariposa_g/tf*100).toFixed(0)}% Cua:${(r.cuartos_g/tf*100).toFixed(0)}%</div>
        </div>
        <div style="background:#fff;border:1px solid var(--color-border);border-radius:var(--radius);padding:5px">

          <div style="font-size:10px;color:#888">EL:${((r.el_g/(r.el_g+r.light_g+r.amarillo_g+r.ambar_light_g+r.ambar_g||1))*100).toFixed(0)}%</div>
        </div>

async function imprimirDetalleLote(id){
  const l=lotesCache.find(l=>l.id===id);if(!l)return;

  // Para LC: suma turnos de todos los hijos
  let ts;
  if(l.esConsolidador){
    ts=[];
    (l.fusionOrigen||[]).forEach(hId=>{ts.push(...turnosCache.filter(t=>t.loteId===hId));});
  } else {
    ts=turnosCache.filter(t=>t.loteId===id);
  }

  const kgCT=ts.reduce((a,t)=>a+t.kgCascara,0);
  const pulpaT=ts.reduce((a,t)=>a+t.pulpaTotal,0);
  const rend=kgCT>0?(pulpaT/kgCT*100):0;
  const varMap={};
  ts.forEach(t=>t.variedades.forEach(v=>{
    const nom=(v.nombre||'').trim();if(!nom)return;

    varMap[nom].kg+=(parseInt(v.cantidad)||0)*(parseFloat(v.kg)||0);

      <tr style="background:#f5f5f5"><td style="padding:7px">Kg cáscara procesados</td><td style="padding:7px;font-weight:700">${kgCT.toFixed(0)} kg</td></tr>
      <tr><td style="padding:7px">Kg pulpa obtenida</td><td style="padding:7px;font-weight:700">${pulpaT.toFixed(1)} kg</td></tr>

    await api('GET', '/permisos');
    // Token válido — restaurar sesión
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    document.getElementById('user-label').textContent = currentUser.nombre;
    const rb = document.getElementById('role-badge');
    const RC = { ceo:'#3C3489', admin:'#085041', encargado:'#633806', maquinista:'#0C447C', calidad:'#0e7490', mantenimiento:'#b45309', reportes:'#6b21a8' };
    const RL = { ceo:'CEO', admin:'Admin', encargado:'Encargado', maquinista:'Maquinista', calidad:'Calidad', mantenimiento:'Mantenimiento', reportes:'Reportes' };
    rb.textContent = RL[currentUser.rol];
    rb.style.background = RC[currentUser.rol] + '22';
    rb.style.color = RC[currentUser.rol];
    await cargarDatos();
    buildNav();
    S(getRolePerm(currentUser.rol).secs[0] || 'lotes');
    if (window._autoRefresh) clearInterval(window._autoRefresh);
    window._autoRefresh = setInterval(async () => { await recargar(['lotes','turnos','stock','despachos','eventos']); renderDash(); }, 30000);
  } catch(e) {
    // Token vencido o inválido — limpiar y mostrar login
    TOKEN = '';
    currentUser = null;
    localStorage.removeItem('gp_token');
    localStorage.removeItem('gp_user');
  }
})();
</script>
