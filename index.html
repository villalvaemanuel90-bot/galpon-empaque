<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Galpón de Empaque</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --color-bg:#f8f9fa;--color-surface:#ffffff;--color-border:#e9ecef;--color-border-light:#f1f3f5;
  --color-text:#212529;--color-text-secondary:#6c757d;--color-primary:#2b7a4b;--color-primary-light:#e8f5ee;
  --color-danger:#dc3545;--color-danger-light:#fee2e2;--color-warning:#f59e0b;--color-warning-light:#fef3c7;
  --color-success:#198754;--color-success-light:#d1e7dd;--color-info:#0d6efd;--color-info-light:#cfe2ff;
  --radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);font-size:14px}
.app{padding:1rem;max-width:1100px;margin:0 auto}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;padding:7px 10px;border:1px solid var(--color-border);border-radius:var(--radius);background:#fff;color:var(--color-text);width:100%;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(43,122,75,.1)}
label{display:block;font-size:13px;color:var(--color-text-secondary);margin-bottom:4px}
/* NAV */
.topbar{background:var(--color-primary);padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:1.2rem;border-radius:var(--radius-lg)}
.topbar-title{color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.topbar-user{color:rgba(255,255,255,.85);font-size:13px;display:flex;align-items:center;gap:8px}
.nav{display:flex;gap:5px;margin-bottom:1.2rem;flex-wrap:wrap}
.nav button{font-size:12px;padding:5px 11px;border-radius:var(--radius);border:1px solid var(--color-border);background:#fff;color:var(--color-text-secondary);display:flex;align-items:center;gap:4px;transition:.15s}
.nav button:hover{border-color:var(--color-primary);color:var(--color-primary)}
.nav button.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary);font-weight:500}
/* CARDS */
.card{background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:1rem 1.2rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.sectitle{font-size:15px;font-weight:600;margin-bottom:1rem;color:var(--color-text);display:flex;align-items:center;gap:7px}
/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1rem}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem}
.g3f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{margin-bottom:10px}
/* METRICS */
.metric{background:var(--color-bg);border:1px solid var(--color-border-light);border-radius:var(--radius);padding:.75rem 1rem}
.metric .ml{font-size:12px;color:var(--color-text-secondary);margin-bottom:2px}
.metric .mv{font-size:18px;font-weight:600;color:var(--color-text)}
/* BUTTONS */
.btn1{background:var(--color-primary);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.btn1:hover{background:#236040}
.btn2{background:#fff;color:var(--color-text-secondary);border:1px solid var(--color-border);padding:7px 12px;border-radius:var(--radius);font-size:12px;display:inline-flex;align-items:center;gap:4px}
.btn2:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-danger{background:var(--color-danger-light);color:var(--color-danger);border:none;padding:6px 11px;border-radius:var(--radius);font-size:12px}
.btn-warn{background:var(--color-warning-light);color:#92400e;border:none;padding:6px 11px;border-radius:var(--radius);font-size:12px}
.stbtn{font-size:11px;padding:3px 8px;border-radius:var(--radius);border:1px solid var(--color-border);background:#fff;color:var(--color-text-secondary);display:inline-flex;align-items:center;gap:3px}
.stbtn:hover{border-color:var(--color-primary);color:var(--color-primary)}
/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500;white-space:nowrap}
.brecv{background:#dbeafe;color:#1e40af}.bprod{background:#fef3c7;color:#92400e}.bstock{background:#d1fae5;color:#065f46}.bent{background:#f3f4f6;color:#374151}
.bpropio{background:#ede9fe;color:#5b21b6}.bterc{background:#fee2e2;color:#991b1b}.bfusion{background:#f3e8ff;color:#6b21a8}
.bnuez{background:#fef3c7;color:#92400e}.bave{background:#fee2e2;color:#991b1b}.balm{background:#d1fae5;color:#065f46}
.bbb{background:#dbeafe;color:#1e40af}
.bdias-ok{background:#d1fae5;color:#065f46}.bdias-med{background:#fef3c7;color:#92400e}.bdias-urg{background:#fee2e2;color:#991b1b}
/* MISC */
.divider{font-size:12px;color:var(--color-text-secondary);font-weight:600;margin:.9rem 0 7px;padding-bottom:4px;border-bottom:2px solid var(--color-border-light)}
.empty{text-align:center;color:var(--color-text-secondary);padding:2rem 0}
.pbar-w{background:var(--color-bg);border-radius:4px;height:6px;overflow:hidden;margin-top:3px}
.pbar{height:6px;border-radius:4px;background:var(--color-primary)}
.prog{display:flex;gap:3px;margin:5px 0}
.ps{flex:1;height:4px;border-radius:2px;background:var(--color-border)}
.ps.done{background:var(--color-primary)}.ps.act{background:var(--color-info)}
.tl{border-left:2px solid var(--color-border);padding-left:.9rem;margin-left:6px}
.tli{position:relative;margin-bottom:9px}
.tli::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--color-primary);position:absolute;left:-1.25rem;top:4px}
.fifo-card{border-radius:var(--radius-lg);padding:.85rem 1rem;margin-bottom:7px;border:1px solid var(--color-border);background:#fff}
.fifo-card.top{border:2px solid var(--color-primary);background:var(--color-primary-light)}
.lot-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--color-border-light);flex-wrap:wrap}
.lot-row:last-child{border-bottom:none}
.bb-row{display:grid;grid-template-columns:34px 1fr 90px 28px;gap:5px;align-items:center;margin-bottom:4px}
.bb-num{font-size:11px;font-weight:600;color:var(--color-text-secondary);text-align:center;background:var(--color-bg);border-radius:var(--radius);padding:4px 0;border:1px solid var(--color-border)}
.var-row{display:grid;grid-template-columns:1fr 65px 65px 65px 28px;gap:5px;align-items:center;margin-bottom:5px}
/* ALERTS */
.msg{font-size:13px;padding:8px 12px;border-radius:var(--radius);margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.msg-ok{background:var(--color-success-light);color:var(--color-success)}
.msg-err{background:var(--color-danger-light);color:var(--color-danger)}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a4731,#2b7a4b)}
.login-box{background:#fff;border-radius:var(--radius-lg);padding:2rem;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-logo{text-align:center;margin-bottom:1.5rem}
.login-logo i{font-size:40px;color:var(--color-primary)}
.login-logo h1{font-size:20px;font-weight:700;margin-top:8px;color:var(--color-text)}
/* MODAL */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal-box{background:#fff;border-radius:var(--radius-lg);padding:1.5rem;max-width:620px;width:100%;position:relative;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;font-size:18px;color:var(--color-text-secondary);padding:4px}
/* PRINT */
#print-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:500;overflow-y:auto;padding:2rem}
#print-overlay.show{display:block}
.print-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--color-border)}
/* SECS */
.sec{display:none}.sec.active{display:block}
/* LOADING */
.loading{text-align:center;padding:3rem;color:var(--color-text-secondary)}
.loading i{font-size:32px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* PERMISOS */
.perm-check-wrap{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.perm-check{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;width:auto}
.perm-check input{width:16px;height:16px}
@media(max-width:600px){.g2,.g3f{grid-template-columns:1fr}.nav{gap:4px}.nav button{font-size:11px;padding:4px 8px}}
@media print{.print-toolbar,.no-print{display:none!important}#print-overlay{position:static;padding:1rem}}
/* SUB-TABS */
.subtabs{display:flex;gap:4px;margin-bottom:1rem;border-bottom:2px solid var(--color-border);padding-bottom:0}
.subtab{font-size:13px;padding:7px 14px;border:none;background:transparent;color:var(--color-text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;transition:.15s}
.subtab:hover{color:var(--color-primary)}
.subtab.active{color:var(--color-primary);border-bottom-color:var(--color-primary)}
/* OCULTAR TODO EN IMPRESIÓN MENOS EL OVERLAY */
@media print{
  body > *:not(#print-overlay){display:none!important}
  #print-overlay{display:block!important;position:static!important;padding:1rem!important}
  .print-toolbar{display:none!important}
}
</style>
</head>
<body>

<!-- PRINT OVERLAY -->
<div id="print-overlay">
  <div class="print-toolbar no-print">
    <span style="font-size:16px;font-weight:600"><i class="ti ti-printer"></i> Vista previa</span>
    <div style="display:flex;gap:8px">
      <button class="btn1" onclick="window.print()"><i class="ti ti-printer"></i> Imprimir / PDF</button>
      <button class="btn2" onclick="closePrint()"><i class="ti ti-x"></i> Cerrar</button>
    </div>
  </div>
  <div id="print-content"></div>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <i class="ti ti-building-warehouse"></i>
        <h1>Galpón de Empaque</h1>
        <p style="color:var(--color-text-secondary);font-size:13px;margin-top:4px">Sistema de gestión de frutos secos</p>
      </div>
      <div id="login-msg" class="msg msg-err" style="display:none"></div>
      <div class="field"><label>Usuario</label><input type="text" id="l-user" placeholder="Usuario" onkeydown="if(event.key==='Enter')login()"/></div>
      <div class="field"><label>Contraseña</label><input type="password" id="l-pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()"/></div>
      <button class="btn1" style="width:100%;justify-content:center;margin-top:4px" onclick="login()" id="login-btn">
        <i class="ti ti-login"></i> Ingresar
      </button>
    </div>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="main-app" style="display:none">
  <div class="app">
    <div class="topbar">
      <div class="topbar-title"><i class="ti ti-building-warehouse"></i> Galpón de Empaque</div>
      <div class="topbar-user">
        <span id="user-label"></span>
        <span id="role-badge" class="badge"></span>
        <button class="btn2" style="padding:4px 10px;font-size:12px" onclick="logout()"><i class="ti ti-logout"></i> Salir</button>
      </div>
    </div>
    <div class="nav" id="main-nav"></div>
    <div id="gmsg" class="msg" style="display:none"></div>
    <!-- SECCIONES -->
    <div id="sec-dash" class="sec"></div>
    <div id="sec-nuevo" class="sec"></div>
    <div id="sec-lotes" class="sec"></div>
    <div id="sec-turno" class="sec"></div>
    <div id="sec-fusion" class="sec"></div>
    <div id="sec-stock" class="sec"></div>
    <div id="sec-despachos" class="sec"></div>
    <div id="sec-bigbags" class="sec"></div>
    <div id="sec-calidad" class="sec"></div>
    <div id="sec-regulacion" class="sec"></div>
    <div id="sec-mantenimiento" class="sec"></div>
    <div id="sec-clientes" class="sec"></div>
    <div id="sec-usuarios" class="sec"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    <div id="modal-c"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// API CLIENT
// ═══════════════════════════════════════════════════════════
const API = '';
let TOKEN = localStorage.getItem('gp_token') || '';
let currentUser = JSON.parse(localStorage.getItem('gp_user') || 'null');
let rolePerms = {};
let variedadesCache = [];
let clientesCache = [];
let lotesCache = [], eventosCache = [];
let turnosCache = [];
let regulacionCache = {maquina:[], selectora:[]};
let mantenimientoCache = [];
let devolucionesBBCache = [];
let calidadFrutaCache = [];
let calidadPulpaCache = [];
let calidadCache = [];
let stockCache = {};
let despachosCache = [];

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + '/api' + path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Error del servidor');
  return data;
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
const RC = { ceo:'#3C3489', admin:'#085041', encargado:'#633806', maquinista:'#0C447C', calidad:'#0e7490', mantenimiento:'#b45309', reportes:'#6b21a8' };
const RL = { ceo:'CEO', admin:'Admin', encargado:'Encargado', maquinista:'Maquinista', calidad:'Calidad', mantenimiento:'Mantenimiento', reportes:'Reportes' };
const NAV_ITEMS = [
  {id:'dash',label:'Panel',icon:'ti-chart-bar'},
  {id:'nuevo',label:'Nuevo lote',icon:'ti-plus'},
  {id:'lotes',label:'Lotes',icon:'ti-list'},
  {id:'turno',label:'Reg. turno',icon:'ti-clock'},
  {id:'fusion',label:'Fusionar',icon:'ti-git-merge'},
  {id:'stock',label:'Stock',icon:'ti-box'},
  {id:'despachos',label:'Despachos',icon:'ti-truck'},
  {id:'bigbags',label:'Big bags',icon:'ti-package'},
  {id:'calidad',label:'Calidad',icon:'ti-microscope'},
  {id:'regulacion',label:'Regulación',icon:'ti-settings'},
  {id:'mantenimiento',label:'Mantenimiento',icon:'ti-tool'},
  {id:'clientes',label:'Clientes',icon:'ti-users'},
  {id:'usuarios',label:'Usuarios',icon:'ti-shield'},
];

function getRolePerm(rol) {
  if (rol === 'ceo') return { secs: ['dash','nuevo','lotes','turno','fusion','stock','despachos','bigbags','calidad','regulacion','mantenimiento','clientes','usuarios'], canResolverMant:true, canBorrarMant:true, canEdit:true, canDelete:true, canFinalize:true, canFusion:true, canReasignar:true };
  return rolePerms[rol] || { secs:[], canEdit:false, canDelete:false, canFinalize:false, canFusion:false, canReasignar:false };
}
function canSec(s) { if (!currentUser) return false; if (currentUser.rol === 'ceo') return true; return getRolePerm(currentUser.rol).secs.includes(s); }
function canAction(a) { if (!currentUser) return false; if (currentUser.rol === 'ceo') return true; return !!getRolePerm(currentUser.rol)[a]; }

async function login() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const btn = document.getElementById('login-btn');
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Ingresando...';
  btn.disabled = true;
  try {
    const res = await api('POST', '/login', { username: u, password: p });
    TOKEN = res.token; currentUser = res.user;
    localStorage.setItem('gp_token', TOKEN);
    localStorage.setItem('gp_user', JSON.stringify(currentUser));
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    document.getElementById('login-msg').style.display = 'none';
    document.getElementById('user-label').textContent = currentUser.nombre;
    const rb = document.getElementById('role-badge');
    rb.textContent = RL[currentUser.rol]; rb.style.background = RC[currentUser.rol]+'22'; rb.style.color = RC[currentUser.rol];
    await cargarDatos();
    buildNav();
    S(getRolePerm(currentUser.rol).secs[0] || 'lotes');
    if (window._autoRefresh) clearInterval(window._autoRefresh);
    window._autoRefresh = setInterval(async () => { await recargar(['lotes','turnos','stock','despachos','eventos']); renderDash(); }, 30000);
  } catch(e) {
    document.getElementById('login-msg').textContent = e.message;
    document.getElementById('login-msg').style.display = 'flex';
  } finally {
    btn.innerHTML = '<i class="ti ti-login"></i> Ingresar';
    btn.disabled = false;
  }
}

function logout() {
  TOKEN = ''; currentUser = null;
  localStorage.removeItem('gp_token'); localStorage.removeItem('gp_user');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('l-user').value = ''; document.getElementById('l-pass').value = '';
}

async function cargarDatos() {
  const [perms, vars, clis, lotes, turnos, stock, despachos, regMaq, regSel, mant, calFruta, calPulpa] = await Promise.all([
    api('GET','/permisos'), api('GET','/variedades'), api('GET','/clientes'),
    api('GET','/lotes'), api('GET','/turnos'), api('GET','/stock'), api('GET','/despachos'),
    api('GET','/regulacion/maquina'), api('GET','/regulacion/selectora'), api('GET','/mantenimiento'),
    api('GET','/calidad/fruta'), api('GET','/calidad/pulpa')
  ]);
  rolePerms = perms; variedadesCache = vars; clientesCache = clis;
  lotesCache = lotes; turnosCache = turnos; stockCache = stock; despachosCache = despachos;
  regulacionCache = {maquina: regMaq||[], selectora: regSel||[]};
  mantenimientoCache = mant||[];
  calidadFrutaCache = calFruta||[]; calidadPulpaCache = calPulpa||[];
  calidadCache = [...calidadFrutaCache, ...calidadPulpaCache];
  setTimeout(actualizarBadgeMant, 500);
}

async function recargar(partes = ['lotes','turnos','stock','despachos']) {
  if (partes.includes('lotes')) lotesCache = await api('GET','/lotes');
  if (partes.includes('turnos')) turnosCache = await api('GET','/turnos');
  if (partes.includes('stock')) stockCache = await api('GET','/stock');
  if (partes.includes('despachos')) despachosCache = await api('GET','/despachos');
  if (partes.includes('calidad')) { calidadFrutaCache = await api('GET','/calidad/fruta'); calidadPulpaCache = await api('GET','/calidad/pulpa'); calidadCache = [...calidadFrutaCache,...calidadPulpaCache]; }
  if (partes.includes('regulacion')) { const [rm,rs]=await Promise.all([api('GET','/regulacion/maquina'),api('GET','/regulacion/selectora')]); regulacionCache={maquina:rm||[],selectora:rs||[]}; }
  if (partes.includes('mantenimiento')) { mantenimientoCache = await api('GET','/mantenimiento'); actualizarBadgeMant(); }
  if (partes.includes('eventos') || partes.includes('lotes') || partes.includes('turnos')) { try { eventosCache = await api('GET','/eventos'); } catch(e) {} }
}

// ═══════════════════════════════════════════════════════════
// NAV & SECCIONES
// ═══════════════════════════════════════════════════════════
function buildNav() {
  const perms = getRolePerm(currentUser.rol);
  document.getElementById('main-nav').innerHTML = NAV_ITEMS
    .filter(n => currentUser.rol === 'ceo' || perms.secs.includes(n.id))
    .map(n => `<button onclick="S('${n.id}')" id="nb-${n.id}" data-sec="${n.id}"><i class="ti ${n.icon}"></i> ${n.label}</button>`).join('');
}
function S(id) {
  if (!canSec(id)) return;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  const nb = document.getElementById('nb-'+id); if (nb) nb.classList.add('active');
  const renders = { dash:renderDash, nuevo:renderNuevo, lotes:renderLotes, turno:renderTurnoForm, fusion:renderFusion, stock:renderStock, despachos:renderDespachos, bigbags:renderBigBags, calidad:renderCalidad, regulacion:renderRegulacion, mantenimiento:renderMantenimiento, clientes:renderClientes, usuarios:renderUsuarios };
  if (renders[id]) renders[id]();
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const EL = { recepcion:'Recepción', produccion:'Producción', stock:'Stock', entregado:'Entregado', fusionado:'Fusionado' };
const EB = { recepcion:'brecv', produccion:'bprod', stock:'bstock', entregado:'bent', fusionado:'bfusion' };
const ETAPAS = ['recepcion','produccion','stock'];
function dias(f){const h=new Date();h.setHours(0,0,0,0);const d=new Date(f);d.setHours(0,0,0,0);return Math.round((h-d)/864e5);}
function dcolor(d){return d<=7?'bdias-ok':d<=21?'bdias-med':'bdias-urg';}
function dlabel(d){return d===0?'Hoy':d===1?'1 día':d+' días';}
function fd(s){if(!s)return'';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fdt(s){if(!s)return'';const d=new Date(s);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}
function hoy(){return new Date().toISOString().split('T')[0];}
function msg(txt,t){const e=document.getElementById('gmsg');if(!e)return;e.className='msg '+(t==='ok'?'msg-ok':'msg-err');e.innerHTML='<i class="ti '+(t==='ok'?'ti-circle-check':'ti-alert-circle')+'"></i> '+txt;e.style.display='flex';setTimeout(()=>e.style.display='none',4500);}
function showPrint(html){document.getElementById('print-content').innerHTML=html;document.getElementById('print-overlay').classList.add('show');}
function closePrint(){document.getElementById('print-overlay').classList.remove('show');}
function closeModal(){document.getElementById('modal').style.display='none';}
function openModal(html){document.getElementById('modal-c').innerHTML=html;document.getElementById('modal').style.display='flex';}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

let bbItems = [];
function renderDash(){
  const el=document.getElementById('sec-dash');

  // Solo lotes individuales (no consolidadores) para no duplicar kg
  const lotesInd = lotesCache.filter(l => !l.esConsolidador);

  // Fruta entera — por peso de ingreso
  const kgTotalRecibidos = lotesInd.reduce((a,l) => a + (l.pesoIngreso||0), 0);

  // Excluir hijos de consolidadores activos de los conteos independientes
  const hijosEnLC = new Set();
  lotesCache.filter(l=>l.esConsolidador&&!l.finalizado).forEach(c=>(c.fusionOrigen||[]).forEach(id=>hijosEnLC.add(id)));

  // Lotes por etapa (para conteo y próximo) — excluir hijos de LC activos como independientes
  const activos    = lotesInd.filter(l => !l.finalizado && l.etapa === 'recepcion' && !hijosEnLC.has(l.id));
  const enProd     = lotesInd.filter(l => !l.finalizado && l.etapa === 'produccion' && !hijosEnLC.has(l.id));
  const finalizados = lotesInd.filter(l => l.finalizado);

  // Fruta entera en proceso = kg cáscara de TODOS los turnos de lotes en producción
  // incluyendo los hijos de LC activos
  const idsEnProdTodos = new Set([
    ...enProd.map(l => l.id),
    ...Array.from(hijosEnLC)
  ]);
  const kgEnProceso = turnosCache
    .filter(t => idsEnProdTodos.has(t.loteId))
    .reduce((a,t) => a + (t.kgCascara||0), 0);

  // Fruta entera finalizada = kg cáscara de lotes finalizados
  const idsFinalizados = new Set(finalizados.map(l => l.id));
  const kgFinalizados = turnosCache
    .filter(t => idsFinalizados.has(t.loteId))
    .reduce((a,t) => a + (t.kgCascara||0), 0);

  // Pulpa total acumulada
  const kgTotalPulpa = turnosCache.reduce((a,t) => a + (t.pulpaTotal||0), 0);

  // Base para rendimiento = toda la cáscara procesada (en proceso + finalizada)
  const kgTotalCascara = kgEnProceso + kgFinalizados;

  // Mes calendario actual (1 al día de hoy)
  const hoy = new Date();
  const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().split('T')[0];
  const turnosMes = turnosCache.filter(t => t.fecha >= inicioMes);
  const kgMesCascara = turnosMes.reduce((a,t) => a + (t.kgCascara||0), 0);
  const kgMesPulpa   = turnosMes.reduce((a,t) => a + (t.pulpaTotal||0), 0);
  const mesLabel     = hoy.toLocaleDateString('es-AR', {month:'long', year:'numeric'});

  const proxLote = activos.slice().sort((a,b) => new Date(a.fecha)-new Date(b.fecha))[0];
  const ultMovs  = eventosCache;

  el.innerHTML=`
  <div class="card" style="margin-bottom:1rem">
    <div class="sectitle"><i class="ti ti-wheat"></i> Fruta entera (cáscara)</div>
    <div class="g3">
      <div class="metric">
        <div class="ml">Total recibido</div>
        <div class="mv">${kgTotalRecibidos.toFixed(0)}</div>
        <div class="ms">kg ingresados al galpón</div>
      </div>
      <div class="metric">
        <div class="ml">En proceso</div>
        <div class="mv" style="color:var(--color-warning)">${kgEnProceso.toFixed(0)}</div>
        <div class="ms">kg procesados de lotes activos</div>
      </div>
      <div class="metric">
        <div class="ml">Finalizados</div>
        <div class="mv" style="color:var(--color-success)">${kgFinalizados.toFixed(0)}</div>
        <div class="ms">kg de lotes cerrados</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:1rem">
    <div class="sectitle"><i class="ti ti-box"></i> Pulpa obtenida</div>
    <div class="g3">
      <div class="metric">
        <div class="ml">Total pulpa</div>
        <div class="mv" style="color:var(--color-primary)">${kgTotalPulpa.toFixed(0)}</div>
        <div class="ms">kg acumulados histórico</div>
      </div>
      <div class="metric">
        <div class="ml">Rendimiento global</div>
        <div class="mv" style="color:${kgTotalCascara>0&&(kgTotalPulpa/kgTotalCascara*100)>=25?'var(--color-success)':'var(--color-warning)'}">${kgTotalCascara>0?((kgTotalPulpa/kgTotalCascara)*100).toFixed(1):0}%</div>
        <div class="ms">pulpa / cáscara procesada</div>
      </div>
      <div class="metric">
        <div class="ml">Stock actual</div>
        <div class="mv">${stockCache?Object.values(stockCache).reduce((a,s)=>a+Object.values(s).filter(x=>x.cantidad>0).length,0):0}</div>
        <div class="ms">items en stock</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:1rem">
    <div class="sectitle"><i class="ti ti-calendar-month"></i> Este mes — ${mesLabel}</div>
    <div class="g2">
      <div class="metric">
        <div class="ml">Kg procesados</div>
        <div class="mv">${kgMesCascara.toFixed(0)}</div>
        <div class="ms">fruta entera este mes</div>
      </div>
      <div class="metric">
        <div class="ml">Kg pulpa</div>
        <div class="mv">${kgMesPulpa.toFixed(0)}</div>
        <div class="ms">obtenidos este mes</div>
      </div>
    </div>
  </div>

  <div class="g2" style="margin-bottom:1rem">
    <div class="card">
      <div class="sectitle"><i class="ti ti-layers"></i> Por etapa</div>
      <div style="margin-bottom:6px;display:flex;align-items:center;gap:8px"><span class="badge brecv">Recepción</span><span>${activos.length} lotes — ${activos.reduce((a,l)=>a+(l.pesoIngreso||0),0).toFixed(0)} kg</span></div>
      <div style="margin-bottom:6px;display:flex;align-items:center;gap:8px"><span class="badge bprod">Producción</span><span>${enProd.length} lotes — ${enProd.reduce((a,l)=>a+(l.pesoIngreso||0),0).toFixed(0)} kg ingreso</span></div>
      <div style="display:flex;align-items:center;gap:8px"><span class="badge bent">Finalizados</span><span>${finalizados.length} lotes</span></div>
    </div>
    <div class="card">
      <div class="sectitle"><i class="ti ti-star"></i> Próximo a producir</div>
      ${proxLote?`<div style="font-weight:600">${proxLote.id}</div>
        <div style="font-size:13px"><span class="badge b${proxLote.producto}">${proxLote.producto}</span> ${proxLote.pesoIngreso.toFixed(0)} kg · ${fd(proxLote.fecha)}</div>
        <div style="font-size:12px;color:var(--color-text-secondary)">${proxLote.tipo==='tercero'?(proxLote.clienteNombre||''):(proxLote.productor||'')}</div>
        <button class="btn1" style="margin-top:8px;font-size:12px" onclick="pasarProd('${proxLote.id}')"><i class="ti ti-arrow-right"></i> Pasar a producción</button>`
      :'<p class="empty">No hay lotes en recepción.</p>'}
    </div>
  </div>

  <div class="card">
    <div class="sectitle"><i class="ti ti-activity"></i> Últimos movimientos</div>
    ${ultMovs.length?ultMovs.map(h=>{const icons={lote:'📦',turno:'⚙️',calidad_fruta:'🔬',calidad_pulpa:'🧪',despacho:'🚚',mantenimiento:'🔧'};const icon=icons[h.tipo]||'📋';return `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--color-border-light);font-size:13px"><span style="color:var(--color-text-secondary);min-width:130px">${fdt(h.fecha)}</span><span>${icon} <strong>${h.usuario}</strong> — ${h.descripcion}</span></div>`;}).join(''):`<p class="empty">Sin movimientos.</p>`}
  </div>`;
}

function renderClientes(){
  const el=document.getElementById('sec-clientes');
  el.innerHTML=`<div class="card">
    <div class="sectitle"><i class="ti ti-users"></i> Clientes / Productores</div>
    <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
      <input type="text" id="cl-s" placeholder="Buscar..." oninput="filtrarClientes()" style="flex:1"/>
      ${canAction('canEdit')?`<button class="btn1" onclick="nuevoCliente()"><i class="ti ti-plus"></i> Nuevo cliente</button>`:''}
    </div>
    <div id="cl-lista"></div>
  </div>`;
  filtrarClientes();
}

function filtrarClientes(){
  const s=(document.getElementById('cl-s')?.value||'').toLowerCase();
  let clis=clientesCache.filter(c=>!s||(c.nombre+c.contacto+c.localidad).toLowerCase().includes(s));
  const el=document.getElementById('cl-lista');if(!el)return;
  if(!clis.length){el.innerHTML='<p class="empty">Sin clientes registrados.</p>';return;}
  el.innerHTML=clis.map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--color-border-light);flex-wrap:wrap">
    <div style="flex:1"><div style="font-weight:600">${c.nombre}</div><div style="font-size:12px;color:var(--color-text-secondary)">${c.contacto||''}${c.localidad?' · '+c.localidad:''}</div></div>
    ${canAction('canEdit')?`<button class="stbtn" onclick="editarCliente(${c.id})"><i class="ti ti-edit"></i></button>`:''}
    ${canAction('canDelete')?`<button class="stbtn" style="color:var(--color-danger)" onclick="borrarCliente(${c.id})"><i class="ti ti-trash"></i></button>`:''}
  </div>`).join('');
}

function nuevoCliente(){
  openModal(`<div class="sectitle">Nuevo cliente</div>
    <div class="field"><label>Nombre</label><input type="text" id="c-nom" placeholder="Nombre del cliente o productor"/></div>
    <div class="field"><label>Contacto</label><input type="text" id="c-cont" placeholder="Teléfono, email..."/></div>
    <div class="field"><label>Localidad</label><input type="text" id="c-loc" placeholder="Ciudad, provincia..."/></div>
    <div style="display:flex;gap:8px;margin-top:1rem">
      <button class="btn1" onclick="guardarCliente()"><i class="ti ti-check"></i> Guardar</button>
      <button class="btn2" onclick="closeModal()">Cancelar</button>

}

async function guardarCliente(){
  const nombre=document.getElementById('c-nom')?.value.trim();
  if(!nombre){msg('Ingresá el nombre.','err');return;}
  try{const c=await api('POST','/clientes',{nombre,contacto:document.getElementById('c-cont')?.value.trim()||'',localidad:document.getElementById('c-loc')?.value.trim()||''});clientesCache.push(c);msg('Cliente agregado.','ok');closeModal();renderClientes();}catch(e){msg(e.message,'err');}
}

async function editarCliente(id){
  const c=clientesCache.find(x=>x.id===id);if(!c)return;
  openModal(`<div class="sectitle">Editar cliente</div>
    <div class="field"><label>Nombre</label><input type="text" id="c-nom" value="${c.nombre}"/></div>
    <div class="field"><label>Contacto</label><input type="text" id="c-cont" value="${c.contacto||''}"/></div>
    <div class="field"><label>Localidad</label><input type="text" id="c-loc" value="${c.localidad||''}"/></div>
    <div style="display:flex;gap:8px;margin-top:1rem">
      <button class="btn1" onclick="actualizarCliente(${id})"><i class="ti ti-check"></i> Guardar</button>
      <button class="btn2" onclick="closeModal()">Cancelar</button>
    </div>`);
}

async function actualizarCliente(id){
  const nombre=document.getElementById('c-nom')?.value.trim();
  const contacto=document.getElementById('c-cont')?.value.trim()||'';
  const localidad=document.getElementById('c-loc')?.value.trim()||'';
  if(!nombre){msg('Ingresá el nombre.','err');return;}
  try{
    await api('PUT','/clientes/'+id,{nombre,contacto,localidad});
    const idx=clientesCache.findIndex(x=>x.id===id);
    if(idx>=0)clientesCache[idx]={...clientesCache[idx],nombre,contacto,localidad};
    msg('Cliente actualizado.','ok');closeModal();renderClientes();
  }catch(e){msg(e.message,'err');}
}

async function borrarCliente(id){
  if(!confirm('¿Borrar este cliente?'))return;
  try{await api('DELETE','/clientes/'+id);clientesCache=clientesCache.filter(x=>x.id!==id);msg('Cliente eliminado.','ok');renderClientes();}catch(e){msg(e.message,'err');}
}

async function cargarUsuarios(){
  try{
    const users=await api('GET','/usuarios');
    const el=document.getElementById('usr-lista');if(!el)return;
    el.innerHTML=users.map(u=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--color-border-light);flex-wrap:wrap">
      <div style="flex:1">
        <div style="font-weight:600">${u.nombre} <span style="font-size:12px;color:var(--color-text-secondary)">(${u.username})</span></div>
        <span style="background:${RC[u.rol]||'#666'};color:#fff;padding:2px 8px;border-radius:999px;font-size:11px">${RL[u.rol]||u.rol}</span>
        ${u.whatsapp?`<span style="font-size:11px;color:var(--color-text-secondary);margin-left:6px"><i class="ti ti-brand-whatsapp"></i> ${u.whatsapp}</span>`:'<span style="font-size:11px;color:var(--color-warning);margin-left:6px">Sin WhatsApp</span>'}
      </div>
      ${currentUser.rol==='ceo'?`
        <button class="stbtn" onclick="editarUsuario(${u.id},'${u.nombre.replace(/'/g,"\'")}','${u.whatsapp||''}')"><i class="ti ti-edit"></i></button>
        ${u.rol!=='ceo'?`<button class="stbtn" style="color:var(--color-danger)" onclick="borrarUsuario(${u.id})"><i class="ti ti-trash"></i></button>`:''}
      `:''}
    </div>`).join('');
  }catch(e){console.error(e);}
}

async function crearUsuario(){
  const nombre=document.getElementById('u-nom')?.value.trim();
  const username=document.getElementById('u-usr')?.value.trim();
  const password=document.getElementById('u-pass')?.value;
  const whatsapp=(document.getElementById('u-wa')?.value||'').trim();
  const rol=document.getElementById('u-rol')?.value;
  if(!nombre||!username||!password){msg('Completá todos los campos.','err');return;}
  try{await api('POST','/usuarios',{nombre,username,password,rol,whatsapp});msg('Usuario creado.','ok');closeModal();cargarUsuarios();}catch(e){msg(e.message,'err');}
}

async function guardarEdicionUsuario(id){
  const nombre=document.getElementById('eu-nom')?.value.trim();
  const whatsapp=(document.getElementById('eu-wa')?.value||'').trim();
  const password=document.getElementById('eu-pass')?.value||'';
  if(!nombre){msg('El nombre es obligatorio.','err');return;}
  const body={nombre,whatsapp};
  if(password) body.password=password;
  try{
    await api('PUT','/usuarios/'+id,body);
    msg('Usuario actualizado.','ok');
    closeModal();
    cargarUsuarios();
  }catch(e){msg(e.message,'err');}
}

async function togglePerm(rol, tipo, key, val){
  try{
    const p=getRolePerm(rol);
    if(tipo==='sec'){if(val&&!p.secs.includes(key))p.secs.push(key);else p.secs=p.secs.filter(s=>s!==key);}
    else{p[key]=val;}
    await api('PUT',`/permisos/${rol}`,p);
    rolePerms[rol]=p;
    msg('Permiso actualizado.','ok');
  }catch(e){msg(e.message,'err');}
}

function addBB(){bbItems.push({num:bbItems.length+1,kg:''});renderBB();setTimeout(()=>{const ins=document.querySelectorAll('.bb-inp');if(ins.length)ins[ins.length-1].focus();},50);}
function removeBB(){if(bbItems.length){bbItems.pop();renderBB();}}
function renderBB(){
  const el=document.getElementById('bb-lista'),bq=document.getElementById('btn-quitarbb'),tot=document.getElementById('bb-total');if(!el)return;
  if(!bbItems.length){el.innerHTML='<p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:6px">Sin big bags cargados.</p>';if(bq)bq.style.display='none';if(tot)tot.style.display='none';return;}

function updBBTotal(){
  const tot=document.getElementById('bb-total');if(!tot)return;

  tot.style.display='flex';tot.style.justifyContent='space-between';
  tot.innerHTML=`<span style="color:var(--color-text-secondary)">Total</span><span><span class="badge bbb">${bbItems.length} BB</span> <strong>${suma.toFixed(1)} kg</strong>${sp>0?' <span style="font-size:11px;color:var(--color-warning)">'+sp+' sin pesar</span>':''}</span>`;
}
async function crearLote(){
  const tipo=document.getElementById('n-tipo').value,fecha=document.getElementById('n-fecha').value;
  const clienteId=tipo==='tercero'?document.getElementById('n-cliente').value:null;
  const productor=tipo==='propio'?(document.getElementById('n-productor').value||'').trim():'';
  if(!fecha){msg('Seleccioná la fecha.','err');return;}
  if(tipo==='tercero'&&!clienteId){msg('Seleccioná un cliente.','err');return;}
  if(!bbItems.length){msg('Agregá al menos un big bag.','err');return;}
  const pesoTotal=bbItems.reduce((a,b)=>a+(parseFloat(b.kg)||0),0);
  const cliente=clienteId?clientesCache.find(c=>String(c.id)===String(clienteId)):null;
  try {
    const lote = await api('POST','/lotes',{tipo,producto:document.getElementById('n-prod').value,variedad:(document.getElementById('n-var').value||'').trim(),pesoIngreso:pesoTotal,fecha,origen:(document.getElementById('n-origen').value||'').trim(),obs:(document.getElementById('n-obs').value||'').trim(),clienteId:clienteId?String(clienteId):null,clienteNombre:cliente?cliente.nombre:null,productor,bigBags:bbItems.map(b=>({num:b.num,kg:parseFloat(b.kg)||0}))});
    msg('Lote '+lote.id+' registrado — '+bbItems.length+' BB, '+pesoTotal.toFixed(1)+' kg.','ok');
    bbItems=[];renderNuevo();await recargar(['lotes']);renderDash();
  } catch(e){msg(e.message,'err');}
}

function filtrarProduccion(){
  const s=(document.getElementById('sp-s')?.value||'').toLowerCase();
  const hijosEnLC = new Set();
  lotesCache.filter(l=>l.esConsolidador&&!l.finalizado).forEach(c=>(c.fusionOrigen||[]).forEach(id=>hijosEnLC.add(id)));
  let lotes=lotesCache.filter(l=>!l.finalizado&&!l.fusionado&&l.etapa==='produccion'&&!hijosEnLC.has(l.id));
  if(s)lotes=lotes.filter(l=>(l.id+l.producto+(l.clienteNombre||'')+(l.productor||'')).toLowerCase().includes(s));
  const el=document.getElementById('prod-lista2');if(!el)return;
  if(!lotes.length){el.innerHTML='<p class="empty">Sin resultados.</p>';return;}

  // Map: hijoId → consolidadorId (para mostrar badge en hijos)
  const hijoDeConsolidador={};
  lotesCache.filter(l=>l.esConsolidador&&!l.finalizado).forEach(c=>(c.fusionOrigen||[]).forEach(hId=>{hijoDeConsolidador[hId]=c.id;}));

  el.innerHTML=lotes.map(l=>{
    let kgC, pulpa, rend, pctProc, kgPend, ts;
    if(l.esConsolidador){
      // Totales consolidados: suma de todos los hijos
      ts=[];
      (l.fusionOrigen||[]).forEach(hId=>{ts.push(...turnosCache.filter(t=>t.loteId===hId));});
      kgC=ts.reduce((a,t)=>a+t.kgCascara,0);
      pulpa=ts.reduce((a,t)=>a+t.pulpaTotal,0);
    } else {
      ts=turnosCache.filter(t=>t.loteId===l.id);
      kgC=ts.reduce((a,t)=>a+t.kgCascara,0);
      pulpa=ts.reduce((a,t)=>a+t.pulpaTotal,0);
    }
    rend=kgC>0?(pulpa/kgC*100):0;
    pctProc=l.pesoIngreso>0?(kgC/l.pesoIngreso*100):0;
    kgPend=Math.max(0,l.pesoIngreso-kgC);

    const consolidadorId=hijoDeConsolidador[l.id];
    return `<div class="card" style="margin-bottom:7px${l.esConsolidador?';border-left:3px solid var(--color-primary)':''}">

        <span class="badge b${l.producto}">${l.producto}</span>

        <span style="font-size:12px;color:var(--color-text-secondary)">${l.tipo==='tercero'?(l.clienteNombre||''):(l.productor||'')}</span>
        <span style="font-size:12px;color:var(--color-text-secondary);margin-left:auto">${fd(l.fecha)}</span>
      </div>
      ${l.esConsolidador?`<div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:6px">Agrupa: ${(l.fusionOrigen||[]).map(id=>{const h=lotesCache.find(x=>x.id===id);return `<span style="background:var(--color-bg-secondary);padding:1px 5px;border-radius:3px;margin-right:3px">${id}${h?.finalizado?' ✅':' ⏳'}</span>`;}).join('')}</div>`:''} 
      <div class="g3" style="margin-bottom:6px">
        <div class="metric"><div class="ml">Kg cáscara proc.</div><div class="mv" style="font-size:15px">${kgC.toFixed(0)} kg</div></div>
        <div class="metric"><div class="ml">Kg pulpa</div><div class="mv" style="font-size:15px">${pulpa.toFixed(1)} kg</div></div>
        <div class="metric"><div class="ml">Rendimiento</div><div class="mv" style="font-size:15px;color:${rend>=25?'var(--color-success)':'var(--color-warning)'}">${rend.toFixed(1)}%</div></div>
      </div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:6px">
        Total ingreso: ${l.pesoIngreso.toFixed(0)} kg · Procesado: ${pctProc.toFixed(1)}% · 
        <span style="color:var(--color-warning);font-weight:600">${kgPend.toFixed(0)} kg pendientes</span>
        ${l.esConsolidador?` · <span style="color:var(--color-primary)">${ts.length} turno${ts.length!==1?'s':''} combinados</span>`:''}
      </div>
      <div class="pbar-w" style="margin-bottom:8px"><div class="pbar" style="width:${Math.min(pctProc,100)}%"></div></div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="stbtn" onclick="openDetalle('${l.id}')"><i class="ti ti-eye"></i> Detalle</button>

        ${puedeF?`<button class="stbtn" onclick="finalizarLote('${l.id}')"><i class="ti ti-check"></i> Finalizar</button>`:''}
        ${!tieneProd&&!l.esConsolidador?`<span class="badge" style="background:var(--color-warning-light);color:#92400e"><i class="ti ti-alert-triangle"></i> Sin producción cargada</span>`:''}
        ${canAction('canEdit')&&!l.esConsolidador?`<button class="stbtn" onclick="editarLote('${l.id}')"><i class="ti ti-edit"></i> Editar</button>`:''}
        ${canAction('canDelete')?`<button class="stbtn" style="color:var(--color-danger)" onclick="borrarLote('${l.id}')"><i class="ti ti-trash"></i> Borrar</button>`:''}
      </div>
    </div>`;
  }).join('');
}

  const s=(document.getElementById('ing-s')?.value||'').toLowerCase();
  const el=document.getElementById('ingresos-lista');if(!el)return;
  let list=[...(window._ingresosCache||[])];
  list.sort((a,b)=>{
    const fa=a.fechaIngreso||a.fecha_ingreso||'';
    const fb=b.fechaIngreso||b.fecha_ingreso||'';
    return fb.localeCompare(fa);
  });
  if(s)list=list.filter(r=>(r.lote_id+r.producto+(r.clienteNombre||r.cliente_nombre||'')+(r.productor||'')).toLowerCase().includes(s));
  if(!list.length){el.innerHTML='<p class="empty">Sin resultados.</p>';return;}
  el.innerHTML=list.map((r,i)=>{
    const bbs=r.bigBags||JSON.parse(r.big_bags||'[]');
    const cliente=r.clienteNombre||r.cliente_nombre||'';
    const prod=r.productor||'';
    const esCeo=currentUser.rol==='ceo';
    return `<div style="display:grid;grid-template-columns:60px 80px 1fr 1fr 100px 100px 80px${esCeo?' 70px':''};gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--color-border-light);font-size:13px;background:${i%2===0?'var(--color-bg)':'white'}">
      <span style="font-weight:700;color:var(--color-primary)">${r.lote_id}</span>
      <span style="color:var(--color-text-secondary)">${fd(r.fechaIngreso||r.fecha_ingreso)}</span>
      <span><span class="badge b${r.producto}" style="font-size:11px">${r.producto}</span>${r.variedad?` <span style="font-size:11px;color:var(--color-text-secondary)">${r.variedad}</span>`:''}</span>
      <span style="color:var(--color-text-secondary);font-size:12px">${r.tipo==='tercero'?cliente:prod||'Propio'}</span>
      <span style="font-weight:600">${(r.pesoIngreso||r.peso_ingreso||0).toFixed(0)} kg</span>
      <span style="color:var(--color-text-secondary)">${bbs.length} big bag${bbs.length!==1?'s':''}</span>
      <span style="font-size:11px;color:var(--color-text-secondary)">${r.usuario||'sistema'}</span>
      ${esCeo?`<div style="display:flex;gap:4px"><button class="stbtn" onclick="editarIngreso('${r.lote_id}')" title="Editar"><i class="ti ti-pencil"></i></button><button class="stbtn" style="color:var(--color-danger)" onclick="borrarIngreso('${r.lote_id}')" title="Borrar"><i class="ti ti-trash"></i></button></div>`:''}
    </div>`;
  }).join('');
}

async function borrarIngreso(loteId){
  if(!confirm(`¿Borrar el registro de ingreso del lote ${loteId}? Esta acción no se puede deshacer.`)) return;
  try {
    await api('DELETE', `/ingresos/${loteId}`);
    window._ingresosCache = (window._ingresosCache||[]).filter(r=>r.lote_id!==loteId);
    filtrarIngresos();
    msg(`Ingreso ${loteId} eliminado`, 'ok');
  } catch(e){ msg(e.message,'err'); }
}

function editarIngreso(loteId){
  const r = (window._ingresosCache||[]).find(x=>x.lote_id===loteId); if(!r) return;
  const bbs = r.bigBags||JSON.parse(r.big_bags||'[]');
  const bbsHtml = bbs.map((b,i)=>`
    <div style="display:grid;grid-template-columns:100px 1fr 30px;gap:6px;align-items:center;margin-bottom:4px">
      <input type="text" value="${b.codigo||'BB-'+(String(i+1).padStart(3,'0'))}" id="eib-cod-${i}" style="font-size:12px"/>
      <input type="number" value="${b.kg||0}" id="eib-kg-${i}" min="0" step="0.5" style="font-size:12px"/>
      <button class="stbtn" style="color:var(--color-danger);padding:4px" onclick="this.closest('div').remove();recalcPesoIngreso()"><i class="ti ti-x"></i></button>
    </div>`).join('');

  openModal(`<div style="max-width:560px;max-height:80vh;overflow-y:auto">
    <div style="font-weight:700;font-size:16px;margin-bottom:1rem">✏️ Editar Ingreso — ${loteId}</div>
    <div class="g2" style="margin-bottom:10px">
      <div class="field"><label>Fecha</label><input type="date" id="ei-fecha" value="${r.fechaIngreso||r.fecha_ingreso||''}"/></div>
      <div class="field"><label>Tipo</label>
        <select id="ei-tipo">
          <option value="propio" ${r.tipo==='propio'?'selected':''}>Propio</option>
          <option value="tercero" ${r.tipo==='tercero'?'selected':''}>Tercero</option>
        </select>
      </div>
      <div class="field"><label>Cliente</label><input type="text" id="ei-cliente" value="${r.clienteNombre||r.cliente_nombre||''}"/></div>
      <div class="field"><label>Productor</label><input type="text" id="ei-productor" value="${r.productor||''}"/></div>
      <div class="field"><label>Producto</label><input type="text" id="ei-producto" value="${r.producto||''}"/></div>
      <div class="field"><label>Variedad</label><input type="text" id="ei-variedad" value="${r.variedad||''}"/></div>
    </div>
    <div class="divider">Big Bags</div>
    <div id="ei-bbs-lista" style="margin-bottom:6px">${bbsHtml}</div>
    <button class="stbtn" onclick="agregarFilaBB()" style="margin-bottom:8px"><i class="ti ti-plus"></i> Agregar BB</button>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:13px;color:var(--color-text-secondary)">Peso total calculado:</span>
      <span id="ei-peso-total" style="font-weight:700;color:var(--color-primary)">0 kg</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:1rem">
      <button class="btn1" onclick="guardarEdicionIngreso('${loteId}')"><i class="ti ti-device-floppy"></i> Guardar</button>
      <button class="btn2" onclick="closeModal()">Cancelar</button>
    </div>
  </div>`);
  recalcPesoIngreso();
}

function agregarFilaBB(){
  const lista = document.getElementById('ei-bbs-lista'); if(!lista) return;
  const idx = lista.children.length;
  const div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:100px 1fr 30px;gap:6px;align-items:center;margin-bottom:4px';
  div.innerHTML = `<input type="text" value="BB-${String(idx+1).padStart(3,'0')}" id="eib-cod-${idx}" style="font-size:12px"/>
    <input type="number" value="0" id="eib-kg-${idx}" min="0" step="0.5" style="font-size:12px" oninput="recalcPesoIngreso()"/>
    <button class="stbtn" style="color:var(--color-danger);padding:4px" onclick="this.closest('div').remove();recalcPesoIngreso()"><i class="ti ti-x"></i></button>`;
  lista.appendChild(div);
  recalcPesoIngreso();
}

function recalcPesoIngreso(){
  const lista = document.getElementById('ei-bbs-lista'); if(!lista) return;
  let total = 0;
  lista.querySelectorAll('input[type="number"]').forEach(inp => { total += parseFloat(inp.value)||0; });
  const el = document.getElementById('ei-peso-total');
  if(el) el.textContent = total.toFixed(1) + ' kg';
}

async function guardarEdicionIngreso(loteId){
  const lista = document.getElementById('ei-bbs-lista'); if(!lista) return;
  const bbs = [];
  const filas = lista.children;
  for(let i=0; i<filas.length; i++){
    const cod = filas[i].querySelector(`input[type="text"]`)?.value||'';
    const kg = parseFloat(filas[i].querySelector(`input[type="number"]`)?.value)||0;
    if(kg > 0) bbs.push({ codigo: cod, kg });
  }
  const pesoTotal = bbs.reduce((a,b)=>a+b.kg, 0);
  const datos = {
    fecha: document.getElementById('ei-fecha')?.value||'',
    tipo: document.getElementById('ei-tipo')?.value||'propio',
    clienteNombre: document.getElementById('ei-cliente')?.value||'',
    productor: document.getElementById('ei-productor')?.value||'',
    producto: document.getElementById('ei-producto')?.value||'',
    variedad: document.getElementById('ei-variedad')?.value||'',
    bigBags: bbs,
    pesoIngreso: pesoTotal,
  };
  try {
    await api('PUT', `/ingresos/${loteId}`, datos);
    // Actualizar cache local
    const idx = (window._ingresosCache||[]).findIndex(r=>r.lote_id===loteId);
    if(idx>=0) window._ingresosCache[idx] = {...window._ingresosCache[idx], ...datos, big_bags: JSON.stringify(bbs), peso_ingreso: pesoTotal};
    filtrarIngresos();
    closeModal();
    msg(`Ingreso ${loteId} actualizado`, 'ok');
  } catch(e){ msg(e.message,'err'); }
}

function limpiarTurno(){varItems=[];renderVars();['t-turno','t-kgc','t-hi'].forEach(f=>{const e=document.getElementById(f);if(e)e.value='';});const hf=document.getElementById('t-hf');if(hf)hf.value=new Date().toTimeString().slice(0,5);}
function addVar(){varItems.push({nombre:'',cantidad:1,envase:'caja',kg:10});renderVars();setTimeout(()=>{const ins=document.querySelectorAll('.var-inp');if(ins.length)ins[ins.length-1].focus();},50);}
async function addVarNueva(){const n=(prompt('Nombre de la nueva variedad:')||'').trim();if(!n)return;await api('POST','/variedades',{nombre:n});variedadesCache.push(n);varItems.push({nombre:n,cantidad:1,envase:'caja',kg:10});renderVars();}
function renderVars(){
  const el=document.getElementById('var-lista');if(!el)return;
  if(!varItems.length){el.innerHTML='<p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:5px">Sin variedades.</p>';const rp=document.getElementById('rend-prev'),tot=document.getElementById('var-total');if(rp)rp.style.display='none';if(tot)tot.style.display='none';return;}
  el.innerHTML=varItems.map((v,i)=>`<div class="var-row">
    <input type="text" class="var-inp" value="${v.nombre}" placeholder="Variedad..." list="vl-${i}" oninput="varItems[${i}].nombre=this.value;calcRend()"/>
    <datalist id="vl-${i}">${variedadesCache.map(x=>`<option value="${x}">`).join('')}</datalist>
    <input type="number" value="${v.cantidad}" min="1" step="1" style="text-align:center" oninput="varItems[${i}].cantidad=+this.value||1;calcRend()"/>
    <select style="padding:7px 4px" onchange="varItems[${i}].envase=this.value">
      <option value="caja" ${v.envase==='caja'?'selected':''}>Caja</option>
      <option value="bolsa" ${v.envase==='bolsa'?'selected':''}>Bolsa</option>
      <option value="otro" ${v.envase==='otro'?'selected':''}>Otro</option>
    </select>
    <input type="number" value="${v.kg}" min="0.1" step="0.1" style="text-align:center" oninput="varItems[${i}].kg=+this.value||0;calcRend()"/>
    <button onclick="varItems.splice(${i},1);renderVars();calcRend()" style="background:none;border:none;color:var(--color-text-secondary);font-size:16px"><i class="ti ti-x"></i></button>
  </div>`).join('');calcRend();
}
function calcRend(){
  const kgC=parseFloat(document.getElementById('t-kgc')?.value)||0,pulpa=varItems.reduce((a,v)=>a+(v.cantidad*v.kg),0),rend=kgC>0?(pulpa/kgC*100):0;
  const tot=document.getElementById('var-total'),prev=document.getElementById('rend-prev');if(!tot||!prev)return;
  if(varItems.length){tot.style.display='flex';tot.style.justifyContent='space-between';tot.innerHTML=`<span style="color:var(--color-text-secondary)">Total pulpa</span><span><strong>${pulpa.toFixed(1)} kg</strong></span>`;prev.style.display='block';document.getElementById('rend-g3').innerHTML=`<div class="metric"><div class="ml">Kg cáscara</div><div class="mv">${kgC.toFixed(0)} kg</div></div><div class="metric"><div class="ml">Kg pulpa</div><div class="mv">${pulpa.toFixed(1)} kg</div></div><div class="metric"><div class="ml">Rendimiento</div><div class="mv" style="color:${rend>=25?'var(--color-success)':'var(--color-warning)'}">${rend.toFixed(1)}%</div></div>`;}
  else{tot.style.display='none';prev.style.display='none';}
}
async function guardarTurno(){
  const loteId=document.getElementById('t-lote')?.value,fecha=document.getElementById('t-fecha')?.value,turno=document.getElementById('t-turno')?.value.trim(),hi=document.getElementById('t-hi')?.value,hf=document.getElementById('t-hf')?.value,kgCascara=parseFloat(document.getElementById('t-kgc')?.value)||0,kgTotal=parseFloat(document.getElementById('t-kgt')?.value)||0;
  if(!loteId){msg('Seleccioná un lote.','err');return;}if(!fecha){msg('Seleccioná la fecha.','err');return;}if(kgCascara<=0){msg('Ingresá los kg de cáscara.','err');return;}if(!varItems.length){msg('Agregá al menos una variedad.','err');return;}if(varItems.some(v=>!v.nombre.trim())){msg('Completá todos los nombres.','err');return;}
  const pulpaTotal=varItems.reduce((a,v)=>a+(v.cantidad*v.kg),0);
  try {
    await api('POST','/turnos',{loteId,fecha,turno,hi,hf,kgCascara,kgTotal,pulpaTotal,variedades:varItems.map(v=>({...v}))});
    msg('Turno guardado — '+pulpaTotal.toFixed(1)+' kg pulpa.','ok');
    varItems=[];renderVars();limpiarTurno();
    await recargar(['lotes','turnos','stock']);renderDash();
  } catch(e){msg(e.message,'err');}
}

async function guardarEdicionTurno(id, nVars){

  const kgCascara = parseFloat(document.getElementById('ev-kgc')?.value)||0;
  const hi = document.getElementById('ev-hi')?.value||'';
  const hf = document.getElementById('ev-hf')?.value||'';
  const variedades = [];
  for(let i=0;i<nVars;i++){
    const nombre = document.getElementById('ev-nom-'+i)?.value.trim();
    const cantidad = parseInt(document.getElementById('ev-cant-'+i)?.value)||0;
    const envase = document.getElementById('ev-env-'+i)?.value||'caja';
    const kg = parseFloat(document.getElementById('ev-kg-'+i)?.value)||0;
    if(nombre) variedades.push({nombre,cantidad,envase,kg});
  }
  const pulpaTotal = variedades.reduce((a,v)=>a+(v.cantidad*v.kg),0);
  try {
    await api('PUT','/turnos/'+id,{turno,hi,hf,kgCascara,variedades,pulpaTotal});
    closeModal();
    msg('Turno actualizado.','ok');
    await recargar(['lotes','turnos','stock']);
    renderTurnoForm();
    renderDash();
  } catch(e){msg(e.message,'err');}
}
async function borrarTurno(id){
  if(!confirm('¿Borrar este turno? Se revertirá el stock asociado.'))return;
  try {
    await api('DELETE','/turnos/'+id);
    msg('Turno borrado.','ok');
    await recargar(['lotes','turnos','stock']);
    renderTurnoForm();
    renderDash();
  } catch(e){msg(e.message,'err');}
}
function irTurno(loteId){S('turno');setTimeout(()=>{const s=document.getElementById('t-lote');if(s){s.value=loteId;autoKgLote();}},150);}

function renderFusion(){
  // Lotes hijos de consolidadores activos — no disponibles para nueva fusión
  const hijosOcupados = new Set();
  lotesCache.filter(l=>l.esConsolidador&&!l.finalizado).forEach(c=>(c.fusionOrigen||[]).forEach(id=>hijosOcupados.add(id)));

  const disponibles=lotesCache.filter(l=>
    !l.finalizado &&
    !l.esConsolidador &&
    (l.etapa==='recepcion'||l.etapa==='produccion') &&
    !hijosOcupados.has(l.id)
  );

  const consolidadores=lotesCache.filter(l=>l.esConsolidador);

  document.getElementById('sec-fusion').innerHTML=`<div class="card">
    <div class="sectitle"><i class="ti ti-git-merge"></i> Nuevo lote conformado (LC)</div>
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:1rem">Seleccioná 2 o más lotes para agruparlos en un LC. Los lotes originales siguen activos y se les sigue registrando turnos normalmente. Para sumar más lotes a un LC existente, usá el botón "Agregar lote" abajo.</p>
    <div class="g2">
      <div class="field"><label>Tipo</label><select id="f-tipo" onchange="toggleFusionTipo()"><option value="propio">Producción propia</option><option value="tercero">Servicio a tercero</option></select></div>
      <div class="field" id="f-c-cliente" style="display:none"><label>Cliente</label><select id="f-cliente">${clientesCache.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}</select></div>
      <div class="field" id="f-c-productor"><label>Productor / referencia</label><input type="text" id="f-productor" placeholder="Ej: Juan García (combinado)"/></div>
    </div>
    <div class="field"><label>Producto</label><select id="f-prod"><option value="nuez">Nuez</option><option value="avellana">Avellana</option><option value="almendra">Almendra</option></select></div>
    <div class="divider">Seleccioná los lotes a agrupar</div>
    ${!disponibles.length?'<p class="empty">No hay lotes disponibles para consolidar.</p>':
    `<div id="fusion-checks">${disponibles.map(l=>{
      const turnosL=turnosCache.filter(t=>t.loteId===l.id);
      const kgProc=turnosL.reduce((a,t)=>a+(t.kgCascara||0),0);
      const etiquetaEtapa=l.etapa==='produccion'?'<span class="badge bprod" style="font-size:10px">En producción</span>':'<span class="badge brecv" style="font-size:10px">Recepción</span>';
      return `<label style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--color-border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;background:#fff">
        <input type="checkbox" value="${l.id}" onchange="updFusionPreview()" style="width:16px;height:16px"/>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span style="font-weight:600">${l.id}</span>${etiquetaEtapa}
            <span class="badge b${l.producto}">${l.producto}</span>
            <span style="font-size:12px;color:var(--color-text-secondary)">${l.tipo==='tercero'?(l.clienteNombre||''):(l.productor||'')}</span>
          </div>
          <div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px">
            Ingreso: ${l.pesoIngreso.toFixed(0)} kg · ${turnosL.length} turno${turnosL.length!==1?'s':''} · ${kgProc.toFixed(0)} kg procesados
          </div>
        </div>
      </label>`;}).join('')}</div>
    <div id="fusion-preview" style="display:none;margin-top:10px;padding:10px;background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius);font-size:13px"></div>
    <div style="margin-top:1rem"><button class="btn1" onclick="ejecutarFusion()"><i class="ti ti-git-merge"></i> Crear LC</button></div>`}
  </div>
  <div class="card">
    <div class="sectitle"><i class="ti ti-list"></i> Lotes conformados (LC) activos</div>
    ${consolidadores.length?consolidadores.map(l=>{
      const hijos=l.fusionOrigen||[];
      const hijosInfo=hijos.map(id=>{
        const h=lotesCache.find(x=>x.id===id);
        return h?`<span style="display:inline-flex;align-items:center;gap:4px;background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:4px;padding:2px 6px;font-size:11px">${h.id} ${h.finalizado?'✅':'⏳'}</span>`:`<span style="font-size:11px">${id}</span>`;
      }).join(' ');
      return `<div style="padding:10px 0;border-bottom:1px solid var(--color-border-light)">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px">

        </div>
        <div style="margin-bottom:6px">Lotes agrupados: ${hijosInfo}</div>
        ${!l.finalizado?`<button class="stbtn" onclick="agregarHijoConsolidador('${l.id}')"><i class="ti ti-plus"></i> Agregar lote</button>`:''}

function toggleFusionTipo(){const t=document.getElementById('f-tipo')?.value;document.getElementById('f-c-cliente').style.display=t==='tercero'?'block':'none';document.getElementById('f-c-productor').style.display=t==='propio'?'block':'none';}
function updFusionPreview(){
  const checks=[...document.querySelectorAll('#fusion-checks input:checked')];
  const prev=document.getElementById('fusion-preview');if(!prev)return;
  if(checks.length<2){prev.style.display='none';return;}
  const lotes=checks.map(c=>lotesCache.find(l=>l.id===c.value));
  const totalKg=lotes.reduce((a,l)=>a+l.pesoIngreso,0);
  const turnosTotal=lotes.reduce((a,l)=>a+turnosCache.filter(t=>t.loteId===l.id).length,0);
  const kgProc=lotes.reduce((a,l)=>a+turnosCache.filter(t=>t.loteId===l.id).reduce((b,t)=>b+(t.kgCascara||0),0),0);
  prev.style.display='block';
  prev.innerHTML=`<strong>Consolidador nuevo:</strong> ${checks.map(c=>c.value).join(' + ')}<br>Peso total ingreso: <strong>${totalKg.toFixed(0)} kg</strong> · Turnos acumulados: <strong>${turnosTotal}</strong> · Kg procesados: <strong>${kgProc.toFixed(0)} kg</strong>`;
}
async function ejecutarFusion(){
  const checks=[...document.querySelectorAll('#fusion-checks input:checked')];
  if(checks.length<2){msg('Seleccioná al menos 2 lotes.','err');return;}
  const ids=checks.map(c=>c.value),lotes=ids.map(id=>lotesCache.find(l=>l.id===id));
  const tipo=document.getElementById('f-tipo').value,prod=document.getElementById('f-prod').value;
  const clienteId=tipo==='tercero'?document.getElementById('f-cliente').value:null;
  const productor=tipo==='propio'?(document.getElementById('f-productor').value||'').trim():'';
  const cliente=clienteId?clientesCache.find(c=>String(c.id)===String(clienteId)):null;
  const totalKg=lotes.reduce((a,l)=>a+l.pesoIngreso,0);
  try {
    // Si algún hijo ya estaba en producción, el consolidador arranca en producción
    const etapaInicial = lotes.some(l=>l.etapa==='produccion') ? 'produccion' : 'recepcion';
    // Crear lote consolidador — los hijos NO se marcan como fusionados, siguen activos
    const nuevo=await api('POST','/lotes',{tipo,producto:prod,variedad:'',pesoIngreso:totalKg,fecha:hoy(),origen:'',obs:'Lote consolidador',clienteId:clienteId?String(clienteId):null,clienteNombre:cliente?cliente.nombre:null,productor,bigBags:[],etapa:etapaInicial,fusionOrigen:ids});
    // Registrar en la historia de cada hijo que fue incorporado al consolidador
    await Promise.all(lotes.map(l=>api('PUT','/lotes/'+l.id,{historiaNota:`Incorporado al consolidador ${nuevo.id} por ${currentUser.nombre}`})));
    msg(`${nuevo.id} creado — agrupa: ${ids.join(' + ')}.`,'ok');
    await recargar(['lotes']);renderFusion();renderDash();
  } catch(e){msg(e.message,'err');}
}

async function agregarHijoConsolidador(consolidadorId) {
  // Lotes disponibles: no finalizados, no consolidadores, no ya hijos de otro consolidador activo
  const hijosOcupados = new Set();
  lotesCache.filter(l=>l.esConsolidador&&!l.finalizado).forEach(c=>(c.fusionOrigen||[]).forEach(id=>hijosOcupados.add(id)));
  const consolidador = lotesCache.find(l=>l.id===consolidadorId);
  const hijosActuales = new Set(consolidador?.fusionOrigen||[]);
  const disponibles = lotesCache.filter(l=>
    !l.finalizado &&
    !l.esConsolidador &&
    (l.etapa==='recepcion'||l.etapa==='produccion') &&
    !hijosOcupados.has(l.id) &&
    !hijosActuales.has(l.id)
  );
  if (!disponibles.length) { msg('No hay lotes disponibles para agregar.','err'); return; }

  const opciones = disponibles.map(l=>`<option value="${l.id}">${l.id} — ${l.producto} (${l.etapa==='produccion'?'En producción':'Recepción'})</option>`).join('');
  openModal(`
    <div class="sectitle">Agregar lote al consolidador ${consolidadorId}</div>
    <div class="field"><label>Lote a agregar</label><select id="agregar-hijo-sel">${opciones}</select></div>
    <div style="display:flex;gap:8px;margin-top:1rem">
      <button class="btn1" onclick="confirmarAgregarHijo('${consolidadorId}')"><i class="ti ti-plus"></i> Agregar</button>
      <button class="btn2" onclick="closeModal()">Cancelar</button>
    </div>
  `);
}

async function confirmarAgregarHijo(consolidadorId) {
  const hijoId = document.getElementById('agregar-hijo-sel')?.value;
  if (!hijoId) return;
  try {
    await api('POST', '/lotes/'+consolidadorId+'/agregar-hijo', { hijoId });
    msg(`Lote ${hijoId} agregado al consolidador ${consolidadorId}.`,'ok');
    closeModal();
    await recargar(['lotes']); renderFusion();
  } catch(e) { msg(e.message,'err'); }
}

function abrirDespacho(stockKey,label){

    ${items.map((i,idx)=>`<div style="display:grid;grid-template-columns:1fr 90px 90px;gap:6px;padding:5px 0;border-bottom:1px solid var(--color-border-light);align-items:center">

      <input type="number" id="d-${idx}" min="0" max="${i.cantidad}" step="1" value="0" style="text-align:center" data-nombre="${i.nombre}" data-max="${i.cantidad}" data-kgunit="${i.cantidad>0?(i.kg/i.cantidad).toFixed(4):0}" data-envase="${i.envase||''}" oninput="updDespTotal(${items.length})"/>
    </div>`).join('')}

function updDespTotal(n){let t=0;for(let i=0;i<n;i++){const inp=document.getElementById('d-'+i);if(!inp)continue;t+=(parseInt(inp.value)||0)*(parseFloat(inp.dataset.kgunit)||0);}const tv=document.getElementById('desp-tv');if(tv)tv.textContent=t.toFixed(1)+' kg';}
async function confirmarDespacho(stockKey,label,n){
  const lineas=[];
  for(let i=0;i<n;i++){const inp=document.getElementById('d-'+i);if(!inp)continue;const cant=parseInt(inp.value)||0;if(cant<=0)continue;const max=parseInt(inp.dataset.max),kgUnit=parseFloat(inp.dataset.kgunit),nombre=inp.dataset.nombre,envase=inp.dataset.envase;if(cant>max){msg(`"${nombre}": supera el stock (máx ${max}).`,'err');return;}lineas.push({nombre,cantidad:cant,kgUnit,kgTotal:cant*kgUnit,envase});}
  if(!lineas.length){msg('Ingresá al menos una cantidad.','err');return;}
  const transp=document.getElementById('d-transp')?.value.trim()||'',obs=document.getElementById('d-obs')?.value.trim()||'';
  const esPropio=stockKey==='__PROPIO__';
  try {
    const d=await api('POST','/despachos',{stockKey,clienteNombre:label,esPropio,fecha:hoy(),lineas,transp,obs});
    await recargar(['stock','despachos']);closeModal();msg('Despacho '+d.id+' confirmado.','ok');verDespacho(d.id);
  } catch(e){msg(e.message,'err');}
}

window._bbResumenMap = {};
async function renderBigBags(){
  const el=document.getElementById('sec-bigbags');
  try { devolucionesBBCache = await api('GET','/devoluciones-bb'); } catch(e){ devolucionesBBCache=[]; }

  // Resumen por productor/cliente — incluye lotes activos Y finalizados con BB pendientes
  const resumen={};
  lotesCache.filter(l=>!l.fusionado&&l.bigBags?.length>0).forEach(l=>{
    const key=l.tipo==='tercero'?(l.clienteNombre||'Cliente'):(l.productor||'Propio');
    const totalBB=l.bigBags.length;
    const devueltos=l.bbDevueltos||0;
    const pendientes=totalBB-devueltos;
    if(!resumen[key])resumen[key]={total:0,devueltos:0,lotes:[]};
    resumen[key].total+=totalBB;
    resumen[key].devueltos+=devueltos;
    resumen[key].lotes.push({...l,totalBB,devueltos,pendientes});
  });

  el.innerHTML=`<div class="card">
    <div class="sectitle"><i class="ti ti-package"></i> Big bags por productor / cliente</div>
    ${Object.keys(resumen).length?`
    <div style="display:grid;grid-template-columns:1fr 70px 80px 80px 160px;gap:8px;font-size:11px;color:var(--color-text-secondary);font-weight:600;padding-bottom:6px;border-bottom:2px solid var(--color-border);margin-bottom:2px">
      <span>Cliente / productor</span>
      <span style="text-align:center">Total</span>
      <span style="text-align:center">Devueltos</span>
      <span style="text-align:center">Pendientes</span>
      <span></span>
    </div>
    ${Object.entries(resumen).map(([k,v],kIdx)=>{ window._bbResumenMap[kIdx]=k;
      const pend=v.total-v.devueltos;
      // Para el botón devolver, buscar el lote con más pendientes de este productor/cliente
      const lotePrincipal=v.lotes.filter(l=>l.pendientes>0).sort((a,b)=>b.pendientes-a.pendientes)[0];
      return `<div style="display:grid;grid-template-columns:1fr 70px 80px 80px 160px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--color-border-light)">
        <div>
          <div style="font-weight:600;font-size:13px">${k}</div>
          <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">${v.lotes.length} lote${v.lotes.length!==1?'s':''}</div>
        </div>
        <span style="text-align:center"><span class="badge bbb">${v.total}</span></span>
        <span style="text-align:center"><span class="badge" style="background:var(--color-success-light);color:var(--color-success);font-weight:600">${v.devueltos}</span></span>
        <span style="text-align:center"><span class="badge" style="background:${pend>0?'var(--color-warning-light)':'var(--color-success-light)'};color:${pend>0?'#92400e':'var(--color-success)'};font-weight:600">${pend}</span></span>
        <span>${pend>0&&lotePrincipal?`<button class="btn1" style="font-size:11px;padding:5px 10px;width:100%" onclick="abrirDevolucionBBClienteKey(this.dataset.key)" data-key="${k.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"><i class="ti ti-arrow-back-up"></i> Devolver BB</button>`:'<span style="font-size:12px;color:var(--color-success);font-weight:500"><i class="ti ti-circle-check"></i> Al día</span>'}</span>
      </div>`;
    }).join('')}`:'<p class="empty">Sin big bags registrados.</p>'}
  </div>
  <div class="card">
    <div class="sectitle"><i class="ti ti-history"></i> Historial de devoluciones</div>
    ${devolucionesBBCache.length?[...devolucionesBBCache].reverse().slice(0,30).map(d=>{
      const l=lotesCache.find(x=>x.id===d.lote_id);
      const quien=l?`${l.tipo==='tercero'?(l.clienteNombre||''):(l.productor||'Propio')} — ${d.lote_id}`:`${d.lote_id}`;
      return `<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--color-border-light);flex-wrap:wrap;align-items:center">
        <div style="min-width:80px;font-size:12px;color:var(--color-text-secondary)">${fd(d.fecha)}</div>
        <div style="flex:1">
          <div style="font-weight:500;font-size:13px"><span class="badge bbb">${d.cantidad} BB</span> devueltos a <strong>${quien}</strong></div>
          ${d.obs?`<div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px">${d.obs}</div>`:''}
        </div>
        <div style="font-size:12px;color:var(--color-text-secondary)">${d.usuario||''}</div>
      </div>`;
    }).join(''):'<p class="empty">Sin devoluciones registradas.</p>'}
  </div>`;
}

function abrirDevolucionBBClienteKey(key){
  // Reconstruir desde el cache usando la key (nombre del productor/cliente)
  const lotesPend=lotesCache.filter(l=>!l.fusionado&&l.bigBags?.length>0).filter(l=>{
    const k=l.tipo==='tercero'?(l.clienteNombre||'Cliente'):(l.productor||'Propio');
    return k===key;
  }).map(l=>({...l,totalBB:l.bigBags.length,devueltos:l.bbDevueltos||0,pendientes:l.bigBags.length-(l.bbDevueltos||0)})).filter(l=>l.pendientes>0);
  if(!lotesPend.length){msg('Sin BB pendientes.','err');return;}
  abrirDevolucionBBCliente(key,lotesPend);
}

function abrirDevolucionBBCliente(clienteNombre, lotesPendientes){
  // Si tiene un solo lote pendiente, abrir directo. Si tiene varios, mostrar selector.
  if(lotesPendientes.length===1){
    abrirDevolucionBB(lotesPendientes[0].id, lotesPendientes[0].pendientes, clienteNombre);
    return;
  }
  // Varios lotes pendientes — mostrar selector
  openModal(`<div class="sectitle"><i class="ti ti-package"></i> Devolver big bags — ${clienteNombre}</div>
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:1rem">Este productor/cliente tiene BB pendientes en varios lotes. Seleccioná el lote:</p>
    ${lotesPendientes.map(l=>`<div style="display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--color-border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;background:#fff" onclick="closeModal();abrirDevolucionBB('${l.id}',${l.pendientes},'${clienteNombre}')">
      <div style="flex:1"><div style="font-weight:600">${l.id}</div><div style="font-size:12px;color:var(--color-text-secondary)">${l.producto} · ${fd(l.fecha)}</div></div>
      <span class="badge" style="background:var(--color-warning-light);color:#92400e">${l.pendientes} BB pendientes</span>
      <i class="ti ti-chevron-right" style="color:var(--color-text-secondary)"></i>
    </div>`).join('')}
    <button class="btn2" onclick="closeModal()" style="margin-top:8px">Cancelar</button>`);
}

function abrirDevolucionBB(loteId, pendientes, clienteNombreLabel){
  const l=lotesCache.find(l=>l.id===loteId);if(!l)return;
  const label=clienteNombreLabel||(l.tipo==='tercero'?(l.clienteNombre||''):(l.productor||'Propio'));
  openModal(`<div class="sectitle"><i class="ti ti-arrow-back-up"></i> Registrar devolución de big bags</div>
    <div style="background:var(--color-primary-light);border:1px solid var(--color-primary);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px">
      <div style="font-weight:600;color:var(--color-primary)">${label}</div>
      <div style="color:var(--color-text-secondary);margin-top:2px">Lote ${loteId} · <strong>${pendientes} BB pendientes de devolución</strong></div>
    </div>
    <div class="field">
      <label>¿Cuántos BB devolvés hoy?</label>
      <input type="number" id="bb-cant" min="1" max="${pendientes}" value="${pendientes}" style="font-size:22px;font-weight:700;text-align:center;padding:10px"/>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">Máximo: ${pendientes} BB</div>
    </div>
    <div class="field"><label>Fecha de entrega</label><input type="date" id="bb-fecha" value="${hoy()}"/></div>
    <div class="field"><label>Entregado a / observación</label><input type="text" id="bb-obs" placeholder="Ej: Entregados al transportista Juan García..."/></div>
    <div style="display:flex;gap:8px;margin-top:1rem">
      <button class="btn1" onclick="confirmarDevolucionBB('${loteId}',${pendientes})"><i class="ti ti-check"></i> Confirmar devolución</button>
      <button class="btn2" onclick="closeModal()">Cancelar</button>
    </div>`);
}

async function confirmarDevolucionBB(loteId, pendientes){
  const cant=parseInt(document.getElementById('bb-cant')?.value)||0;
  const fecha=document.getElementById('bb-fecha')?.value;
  const obs=document.getElementById('bb-obs')?.value.trim()||'';
  if(cant<=0){msg('Ingresá una cantidad válida.','err');return;}
  if(cant>pendientes){msg(`Máximo ${pendientes} BB pendientes.`,'err');return;}
  try{
    await api('POST','/devoluciones-bb',{loteId,cantidad:cant,fecha,obs});
    msg(`${cant} BB registrados como devueltos.`,'ok');
    await recargar(['lotes']);
    closeModal();
    renderBigBags();
  }catch(e){msg(e.message,'err');}
}

async function marcarDevuelto(id){
  const l=lotesCache.find(l=>l.id===id);if(!l)return;
  const pend=(l.bigBags?.length||0)-(l.bbDevueltos||0);
  if(pend>0)abrirDevolucionBB(id,pend);
}

const COLORES_PROCESO_SURTIDO = ['Extra Light','Light','Amarillo','Ámbar Light','Ámbar','Surtido Industrial'];

// Calcula % para zaranda dado un objeto {peso_muestra, cascara_g, capote_g, pulpa_g, subpulpa}
function calcPctZaranda(z) {
  const pm = z.peso_muestra || 0;
  const casc = z.cascara_g || 0;
  const cap = z.capote_g || 0;
  const pulpa = z.pulpa_g || 0;
  const mar = (z.subpulpa?.mariposas) || 0;
  const cua = (z.subpulpa?.cuartos) || 0;
  const cuar = (z.subpulpa?.cuartillos) || 0;
  const pct = (v, base) => base > 0 ? (v / base * 100).toFixed(1) + '%' : '—';
  return {
    pctCascara:  pct(casc,  pm),
    pctCapote:   pct(cap,   pm),
    pctPulpa:    pct(pulpa, pm),
    pctMariposas:  pct(mar,  pulpa),
    pctCuartos:    pct(cua,  pulpa),
    pctCuartillos: pct(cuar, pulpa),
  };
}

function calcCanalPreview(){
  const pm    = parseFloat(document.getElementById('cpp-peso')?.value)||0;
  const casc  = parseFloat(document.getElementById('cpp-cascara')?.value)||0;
  const cap   = parseFloat(document.getElementById('cpp-capote')?.value)||0;
  const pulpa = pm - casc - cap;
  const pct   = (v, base) => base > 0 ? (v/base*100).toFixed(1)+'%' : '—';
  const prev  = document.getElementById('canal-preview'); if(!prev) return;
  if(pm <= 0){ prev.innerHTML=''; return; }

  const punto = PUNTOS_PROCESO[_cpPunto];
  const lista = punto?.conSurtido ? COLORES_PROCESO_SURTIDO : COLORES_PROCESO;
  const colores = {};
  lista.forEach(c => {
    const key = c.replace(/[^a-z]/gi,'').toLowerCase();
    colores[c] = parseFloat(document.getElementById(`cpp-color-${key}`)?.value)||0;
  });
  const totalColores = Object.values(colores).reduce((a,v)=>a+v,0);

  prev.innerHTML = `
    <div style="background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius);padding:10px">
      <div style="font-weight:600;font-size:12px;color:var(--color-primary);margin-bottom:8px">Resultados — ${PUNTOS_PROCESO[_cpPunto]?.label||''}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;text-align:center;margin-bottom:${totalColores>0?'10px':'0'}">
        <div><div style="color:var(--color-text-secondary)">Cáscara</div><div style="font-weight:700">${casc} gr — ${pct(casc,pm)}</div></div>
        <div><div style="color:var(--color-text-secondary)">Capote</div><div style="font-weight:700">${cap} gr — ${pct(cap,pm)}</div></div>
        <div><div style="color:var(--color-text-secondary)">Pulpa</div><div style="font-weight:700;color:var(--color-success)">${Math.max(0,pulpa).toFixed(0)} gr — ${pct(Math.max(0,pulpa),pm)}</div></div>
      </div>
      ${totalColores > 0 ? `
      <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:6px">Colores (% sobre pulpa):</div>
      <div style="display:grid;grid-template-columns:repeat(${lista.length},1fr);gap:4px;font-size:11px;text-align:center">
        ${lista.map(c=>`<div><div style="color:var(--color-text-secondary)">${c}</div><div style="font-weight:700">${pct(colores[c],totalColores)}</div></div>`).join('')}
      </div>` : ''}
    </div>`;
}
